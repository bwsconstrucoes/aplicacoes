# Postgres DESCARTÁVEL para rodar os testes marcados com "banco" no PC.
#
#   docker compose -f docker-compose.teste.yml up -d
#   set ERP_TEST_DATABASE_URL=postgresql://erp:erp@localhost:5433/erp_teste   (Windows)
#   export ERP_TEST_DATABASE_URL=postgresql://erp:erp@localhost:5433/erp_teste (Linux/Mac)
#   python -m pytest
#
# Porta 5433 de propósito, para não bater num Postgres que já exista na máquina.
# O conteúdo é apagado a cada rodada da suíte; não guarde nada aqui.
services:
  postgres-teste:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_teste
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # ⚠️ SEM DURABILIDADE, DE PROPÓSITO (29/09/2026). Este banco vive em memória e
    # morre com o container: gravar em disco com segurança aqui é pagar caro por
    # uma garantia que ninguém vai usar. NUNCA em produção — com `fsync=off` uma
    # queda de energia corrompe o banco.
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c checkpoint_timeout=1h -c autovacuum=off
