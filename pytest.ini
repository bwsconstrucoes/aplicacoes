[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers --tb=short
markers =
    banco: precisa de um Postgres DESCARTÁVEL em ERP_TEST_DATABASE_URL; sem a variável, é pulado

# Os testes do ERP rodam SEM banco: os models do SQLAlchemy são instanciados em
# memória e a Session é dublada (ver tests/conftest.py). Nenhum teste abre
# conexão, então DATABASE_URL não é lida — e a produção não corre risco.
#
# Para rodar:
#   pip install -r requirements-dev.txt
#   python -m pytest
#
# Os testes marcados com @pytest.mark.banco são a exceção: rodam contra um
# Postgres de verdade, DESCARTÁVEL, apontado por ERP_TEST_DATABASE_URL. Sem a
# variável, são pulados. Com ela, o conftest recusa qualquer endereço que não
# seja local e cujo nome do banco não contenha "teste" — a produção nunca é
# alcançável por aqui. No GitHub Actions o banco sobe sozinho a cada envio
# (.github/workflows/testes.yml); no PC, docker-compose.teste.yml sobe o mesmo.
