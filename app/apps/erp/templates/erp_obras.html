{% extends "erp_base.html" %}
{% block titulo %}Obras — ERP BWS{% endblock %}

{% block filtros %}
  <div class="filtros-cab"><h2>Filtros</h2><button class="link-btn" id="btn-limpar">Limpar</button></div>
  <div class="busca"><span class="lupa">⌕</span>
    <input id="f-busca" type="search" placeholder="código, nome, cliente…"></div>
  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Fase da obra</span>
      <span class="filtro-badge" id="badge-fase">0</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div class="filtro-opcoes" id="opcoes-fase"></div></div>
  </div>
  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Atenção</span><span class="seta">▾</span></button>
    <div class="filtro-cont">
      <label class="opcao"><input type="checkbox" id="f-vigencia">
        <span class="rotulo">Vigência vencendo (90 dias)</span></label>
      <label class="opcao"><input type="checkbox" id="f-reajuste">
        <span class="rotulo">Reajuste a pedir (60 dias)</span></label>
      <label class="opcao"><input type="checkbox" id="f-fiscal">
        <span class="rotulo">Sem tributação cadastrada</span></label>
      <label class="opcao"><input type="checkbox" id="f-margem">
        <span class="rotulo">Gasto acima do recebido</span></label>
    </div>
  </div>
{% endblock %}

{% block conteudo %}
<div id="mensagem"></div>
<div class="kpis" id="kpis"></div>

<div class="tabela-wrap">
  <div class="tabela-barra">
    <span class="resumo" id="resumo"></span>
    <span class="espaco"></span>
    <span id="exportar" style="display:flex; gap:6px"></span>
    <button class="btn secundario" id="btn-mapa">🗺 Mapa</button>
    <button class="btn secundario" id="btn-nova">+ Nova obra</button>
  </div>
  <div class="tabela-rolagem">
    <table><thead><tr>
      <th data-ordem="codigo">Código</th><th data-ordem="nome">Obra</th>
      <th>Cliente</th><th data-ordem="fase">Fase</th>
      <th class="direita" data-ordem="valor_vigente">Contrato vigente</th>
      <th class="direita" data-ordem="recebido">Recebido</th>
      <th class="direita" data-ordem="gasto">Gasto</th>
      <th class="direita" data-ordem="margem">Saldo</th>
      <th>Vigência</th><th>Alertas</th>
    </tr></thead><tbody id="corpo"></tbody></table>
  </div>
  <div class="vazio oculto" id="vazio"></div>
</div>

<dialog id="dlg"><div class="dlg-topo"><h3 id="dlg-titulo">—</h3>
  <button class="topo-btn" style="margin-left:auto" onclick="els('dlg').close()">Fechar</button></div>
  <div class="dlg-corpo" id="dlg-corpo"></div></dialog>
{% endblock %}

{% block scripts %}
<script>
let OBRAS = [], FASES = [], CONTAS = [], F = {fase: new Set()}, ORDEM = {campo:"codigo", asc:true};
const CATEGORIAS_ANEXO = ["CONTRATO","ART","SEGURO","OS","MEDICAO","OUTRO"];

document.querySelectorAll(".filtro-cab").forEach(b =>
  b.addEventListener("click", () => b.closest(".filtro").classList.toggle("aberto")));

async function carregar(){
  try {
    const d = await api("/erp/api/obras");
    OBRAS = d.obras; FASES = d.fases;
    if (!CONTAS.length) {
      try { CONTAS = (await api("/erp/api/contas")).contas; } catch(e) { CONTAS = []; }
    }
    montarFiltros(); desenhar();
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

function montarFiltros(){
  const cont = {};
  OBRAS.forEach(o => cont[o.fase] = (cont[o.fase]||0)+1);
  els("opcoes-fase").innerHTML = FASES.map(f=>`
    <label class="opcao ${cont[f.chave]?"":"zerada"}">
      <input type="checkbox" data-fase="${f.chave}" ${F.fase.has(f.chave)?"checked":""}>
      <span class="rotulo">${f.rotulo}</span><span class="qtd">${cont[f.chave]||0}</span></label>`).join("");
  els("badge-fase").textContent = F.fase.size;
  document.querySelectorAll("[data-fase]").forEach(i=>i.addEventListener("change", ev=>{
    ev.target.checked ? F.fase.add(ev.target.dataset.fase) : F.fase.delete(ev.target.dataset.fase);
    montarFiltros(); desenhar();
  }));
}

function alertas(o){
  const a = [];
  if (o.vence_em_dias !== null && o.vence_em_dias <= 90)
    a.push({t: o.vence_em_dias < 0 ? "Vigência vencida" : `Vigência em ${o.vence_em_dias}d`,
            c: o.vence_em_dias < 0 ? "bloqueado" : "aguardando"});
  if (o.reajuste_em_dias !== null && o.reajuste_em_dias <= 60)
    a.push({t: o.reajuste_em_dias < 0 ? "Reajuste vencido" : `Reajuste em ${o.reajuste_em_dias}d`,
            c: "aguardando"});
  if (!o.aliquota_iss) a.push({t:"Sem ISS", c:"bloqueado"});
  if (!o.cno) a.push({t:"Sem CNO", c:"outro"});
  if (o.gasto > o.recebido && o.recebido > 0) a.push({t:"Gasto > recebido", c:"bloqueado"});
  return a;
}

function visiveis(){
  const b = (els("f-busca").value||"").toLowerCase().trim();
  let l = OBRAS.filter(o => {
    if (F.fase.size && !F.fase.has(o.fase)) return false;
    if (els("f-vigencia").checked && !(o.vence_em_dias !== null && o.vence_em_dias <= 90)) return false;
    if (els("f-reajuste").checked && !(o.reajuste_em_dias !== null && o.reajuste_em_dias <= 60)) return false;
    if (els("f-fiscal").checked && o.aliquota_iss) return false;
    if (els("f-margem").checked && !(o.gasto > o.recebido && o.recebido > 0)) return false;
    if (b && !`${o.codigo} ${o.nome} ${o.cliente||""} ${o.objeto||""}`.toLowerCase().includes(b)) return false;
    return true;
  });
  const {campo, asc} = ORDEM;
  return l.sort((x,y)=>{ let a=x[campo], c=y[campo];
    if (a===null) return 1; if (c===null) return -1;
    return typeof a === "string" ? (asc?a.localeCompare(c,"pt-BR"):c.localeCompare(a,"pt-BR")) : (asc?a-c:c-a); });
}

function desenhar(){
  const l = visiveis();
  const soma = f => l.reduce((a,o)=>a+(f(o)||0),0);
  els("kpis").innerHTML = `
    <div class="kpi estatico"><div class="kpi-rotulo">Obras</div>
      <div class="kpi-valor">${l.length}</div>
      <div class="kpi-sub">${l.filter(o=>o.fase==="EM_EXECUCAO").length} em execução</div></div>
    <div class="kpi estatico ciano"><div class="kpi-rotulo">Contratos vigentes</div>
      <div class="kpi-valor" style="font-size:19px">${moeda(soma(o=>o.valor_vigente))}</div>
      <div class="kpi-sub">${moeda(soma(o=>o.aditivos))} em aditivos</div></div>
    <div class="kpi estatico verde"><div class="kpi-rotulo">Recebido</div>
      <div class="kpi-valor" style="font-size:19px">${moeda(soma(o=>o.recebido))}</div></div>
    <div class="kpi estatico ambar"><div class="kpi-rotulo">Gasto</div>
      <div class="kpi-valor" style="font-size:19px">${moeda(soma(o=>o.gasto))}</div></div>
    <div class="kpi estatico vermelho"><div class="kpi-rotulo">Precisam de atenção</div>
      <div class="kpi-valor">${l.filter(o=>alertas(o).length).length}</div>
      <div class="kpi-sub">vigência, reajuste, fiscal</div></div>`;

  els("vazio").classList.toggle("oculto", l.length>0);
  if (!l.length) els("vazio").innerHTML = OBRAS.length
    ? "<b>Nada nestes filtros</b>" : "<b>Nenhuma obra</b>Cadastre ou importe pela aba Importar.";
  els("corpo").innerHTML = l.map(o=>`
    <tr style="cursor:pointer" data-obra="${o.id}">
      <td class="dados"><b>${o.codigo}</b></td>
      <td class="desc">${o.nome}${o.objeto?`<small>${o.objeto}</small>`:""}</td>
      <td>${o.cliente||"—"}</td>
      <td><span class="selo ${o.fase==="EM_EXECUCAO"?"aprovado":o.fase.startsWith("CONCLUIDA")?"pago":"outro"}">${o.fase_rotulo}</span></td>
      <td class="direita dados">${numero(o.valor_vigente)}${o.aditivos?`<small>+${numero(o.aditivos)}</small>`:""}</td>
      <td class="direita dados">${numero(o.recebido)}</td>
      <td class="direita dados">${numero(o.gasto)}</td>
      <td class="direita dados" style="color:${o.margem<0?"var(--vermelho)":"var(--verde)"}">${numero(o.margem)}</td>
      <td class="dados ${o.vence_em_dias!==null && o.vence_em_dias<0?"atrasado":""}">${dataBR(o.vigencia_fim)}</td>
      <td>${alertas(o).map(a=>`<span class="selo ${a.c}" style="margin-right:3px">${a.t}</span>`).join("")||"—"}</td>
    </tr>`).join("");
  document.querySelectorAll("[data-obra]").forEach(tr =>
    tr.addEventListener("click", ()=>abrir(+tr.dataset.obra)));
  els("resumo").innerHTML = `<b>${l.length}</b> obra(s) · contrato vigente <b>${moeda(soma(o=>o.valor_vigente))}</b>`;
}

// ---------------------------------------------------------------------------
// O DOCUMENTO QUE ARQUIVA E PREENCHE
//
// Duas ações viraram uma. A leitura mostra: o que vai ser arquivado (tipo,
// nome padronizado, datas) e o que vai ser preenchido no cadastro — campo a
// campo, com o valor de hoje ao lado quando houver conflito.
//
// Campo em branco entra MARCADO; campo que já tem valor diferente entra
// DESMARCADO. O que a pessoa digitou vale mais do que o que a IA leu, até ela
// dizer o contrário.
// ---------------------------------------------------------------------------
let DOC_LIDO = null;

function desenharLeituraDoDocumento(obraId){
  const g = DOC_LIDO.sugestao, c = DOC_LIDO.cadastro;
  const cor = {ALTA:"ok", MEDIA:"alerta", BAIXA:"erro"}[g.confianca] || "alerta";
  const linhas = (c.campos || []).map((x, i) => `
    <tr class="${x.conflito ? "" : ""}">
      <td style="width:34px"><input type="checkbox" data-campo="${escapar(x.campo)}"
          ${x.marcar ? "checked" : ""}></td>
      <td>${escapar(x.rotulo)}</td>
      <td><input data-valor="${escapar(x.campo)}" value="${escapar(x.valor)}"
           style="width:100%; padding:5px 8px; border:1px solid var(--borda-forte);
                  border-radius:6px; font-size:13px"></td>
      <td>${x.conflito
        ? `<small style="color:var(--ambar)"><b>hoje está:</b> ${escapar(x.valor_atual)}
            — marque só se quiser trocar</small>`
        : `<small style="color:var(--tinta-suave)">campo vazio hoje</small>`}</td>
    </tr>`).join("");

  const a = c.aditivo;
  els("doc-leitura").innerHTML = `
    <div class="aviso ${cor}" style="margin-top:12px">
      <b>${escapar(g.tipo_nome || "Tipo não reconhecido")}</b>
      ${g.tipo_motivo ? ` — ${escapar(g.tipo_motivo)}` : ""}
      ${g.nome_sugerido ? `<br>Vai ser guardado como
        <b class="mono">${escapar(g.nome_sugerido)}</b>` : ""}
      ${(g.faltando || []).length
        ? `<br>Falta você preencher: <b>${g.faltando.map(escapar).join(", ")}</b>.` : ""}
      ${g.observacoes ? `<br><i>${escapar(g.observacoes)}</i>` : ""}
    </div>

    ${c.tipo_nao_preenche
      ? `<div class="cartao-dica">Este tipo de documento não alimenta o cadastro
          da obra — vai ser só arquivado, e está certo assim.</div>`
      : linhas
        ? `<div class="cartao" style="box-shadow:none; border:1px solid var(--borda); padding:0">
            <div style="padding:10px 12px"><b>O que vai para o cadastro</b>
              <small style="color:var(--tinta-suave)"> — desmarque o que não quiser</small></div>
            <table><tbody>${linhas}</tbody></table></div>`
        : `<div class="cartao-dica">Não achei nada novo para o cadastro:
            ou o documento não diz, ou já está tudo preenchido igual.</div>`}

    ${a ? `<div class="cartao" style="box-shadow:none; border:1px solid var(--borda);
         border-left:4px solid var(--roxo)">
      <label class="opcao" style="margin:0"><input type="checkbox" id="doc-aditivo" checked>
        <span class="rotulo"><b>Registrar o aditivo ${escapar(a.numero || "sem número")}</b></span></label>
      <div class="cartao-dica">${escapar(a.tipo)} ·
        ${a.valor ? `R$ ${escapar(a.valor)}` : "sem valor"} ·
        ${a.dias ? `${a.dias} dia(s)` : "sem prazo"}
        ${a.nova_vigencia_fim ? ` · nova vigência até ${escapar(dataBR(a.nova_vigencia_fim))}` : ""}
        <br>O aditivo entra como registro à parte: o valor vigente do contrato é o
        original mais os aditivos, e o original não é sobrescrito.</div>
    </div>` : ""}

    <div style="margin-top:10px; display:flex; gap:8px; align-items:center">
      <button class="btn amarelo" id="btn-doc-guardar" type="button">Arquivar e preencher</button>
      <button class="link-btn" id="btn-doc-cancelar" type="button">Descartar leitura</button>
    </div>
    <div id="doc-msg"></div>`;

  els("btn-doc-guardar").addEventListener("click", () => guardarDocumentoDaObra(obraId));
  els("btn-doc-cancelar").addEventListener("click", () => {
    DOC_LIDO = null; els("doc-leitura").innerHTML = "";
  });
}

async function lerDocumentoDaObra(obraId){
  const arq = els("doc-arq").files[0];
  if (!arq) { aviso("dlg-msg", "Escolha o arquivo antes de mandar ler.", "erro"); return; }
  const b = els("btn-doc-ler");
  b.disabled = true; b.textContent = "Lendo…";
  els("doc-leitura").innerHTML = `<div class="cartao-dica">Lendo o documento…</div>`;
  try {
    const fd = new FormData();
    fd.append("arquivo", arq);
    if (els("doc-dica").value.trim()) fd.append("dica", els("doc-dica").value.trim());
    DOC_LIDO = await api(`/erp/api/obras/${obraId}/documento/ler`, {method:"POST", body: fd});
    DOC_LIDO.arquivo_lido = arq.name;
    desenharLeituraDoDocumento(obraId);
  } catch(e){
    DOC_LIDO = null;
    els("doc-leitura").innerHTML = `<div class="aviso erro">${escapar(e.message)}</div>`;
  }
  b.disabled = false; b.textContent = "Ler o documento";
}

async function guardarDocumentoDaObra(obraId){
  const arq = els("doc-arq").files[0];
  if (!arq || !DOC_LIDO) { aviso("doc-msg", "Leia o documento antes.", "erro"); return; }
  if (DOC_LIDO.arquivo_lido !== arq.name) {
    aviso("doc-msg", "O arquivo mudou depois da leitura. Leia de novo.", "erro"); return;
  }
  const g = DOC_LIDO.sugestao;
  if (!g.tipo_codigo) {
    aviso("doc-msg", "A leitura não reconheceu o tipo do documento. "
      + "Use “Guardar documento” na tela do Arquivo para escolher o tipo à mão.", "erro");
    return;
  }
  const campos = {};
  document.querySelectorAll("[data-campo]:checked").forEach(c => {
    const campo = c.dataset.campo;
    const entrada = document.querySelector(`[data-valor="${campo}"]`);
    if (entrada && entrada.value.trim()) campos[campo] = entrada.value.trim();
  });

  const b = els("btn-doc-guardar");
  b.disabled = true; b.textContent = "Guardando…";
  try {
    const fd = new FormData();
    fd.append("arquivo", arq);
    fd.append("tipo", g.tipo_codigo);
    ["referencia","emissao","validade","competencia","texto","resumo"].forEach(k => {
      if (g[k]) fd.append(k, g[k]);
    });
    fd.append("campos", JSON.stringify(campos));
    const quer = els("doc-aditivo");
    if (DOC_LIDO.cadastro.aditivo && quer && quer.checked) {
      const a = {...DOC_LIDO.cadastro.aditivo, valor: DOC_LIDO.cadastro.aditivo.valor_bruto};
      fd.append("aditivo", JSON.stringify(a));
    }
    const d = await api(`/erp/api/obras/${obraId}/documento`, {method:"POST", body: fd});
    let recado = `Guardado como <b class="mono">${escapar(d.documento.nome)}</b>.`;
    if (d.preenchido.quantidade)
      recado += ` ${d.preenchido.quantidade} campo(s) do cadastro preenchido(s): `
        + d.preenchido.mudancas.map(escapar).join("; ") + ".";
    if (d.aditivo) recado += ` Aditivo ${escapar(d.aditivo.numero)} registrado.`;
    aviso("dlg-msg", recado, "ok");
    DOC_LIDO = null;
    await carregar();          // o cadastro mudou: a lista de obras se refaz
    painel(4, obraId);         // e a aba de documentos, também
  } catch(e){ aviso("doc-msg", e.message, "erro"); }
  b.disabled = false; b.textContent = "Arquivar e preencher";
}

// A competência que a documentação fiscal costuma ter fechada: o mês passado.
// O mês corrente quase nunca está completo — oferecê-lo como padrão faria o
// conjunto sair vazio e parecer defeito.
function mesPassado(){
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() - 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

// ------------------------------------------------------------------ detalhe
async function abrir(id){
  const o = OBRAS.find(x=>x.id===id);
  els("dlg-titulo").textContent = `${o.codigo} — ${o.nome}`;
  els("dlg-corpo").innerHTML = `<div id="dlg-msg"></div>
    <div class="topo-abas" style="background:var(--azul); border-radius:8px; padding:4px; margin-bottom:14px">
      ${["Resumo","Cadastro","Contrato","Tributação","Documentos","Movimento","Histórico"]
        .map((t,i)=>`<button class="topo-aba ${i===0?"ativa":""}" data-painel="${i}">${t}</button>`).join("")}
    </div>
    <div id="painel"></div>`;
  document.querySelectorAll("[data-painel]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-painel]").forEach(x=>x.classList.remove("ativa"));
    b.classList.add("ativa");
    painel(+b.dataset.painel, id);
  }));
  els("dlg").showModal();
  painel(0, id);
}

async function painel(i, id){
  const o = OBRAS.find(x=>x.id===id);
  const alvo = els("painel");
  alvo.innerHTML = `<div class="cartao-dica">carregando…</div>`;

  if (i === 0) {   // resumo
    alvo.innerHTML = `
      <div class="kpis">
        <div class="kpi estatico"><div class="kpi-rotulo">Fase</div>
          <div class="kpi-valor" style="font-size:15px">${o.fase_rotulo}</div></div>
        <div class="kpi estatico ciano"><div class="kpi-rotulo">Contrato vigente</div>
          <div class="kpi-valor" style="font-size:17px">${numero(o.valor_vigente)}</div>
          <div class="kpi-sub">original ${numero(o.valor_contrato)}</div></div>
        <div class="kpi estatico verde"><div class="kpi-rotulo">Recebido</div>
          <div class="kpi-valor" style="font-size:17px">${numero(o.recebido)}</div></div>
        <div class="kpi estatico ambar"><div class="kpi-rotulo">Gasto</div>
          <div class="kpi-valor" style="font-size:17px">${numero(o.gasto)}</div></div>
        <div class="kpi estatico ${o.margem<0?"vermelho":"verde"}"><div class="kpi-rotulo">Saldo</div>
          <div class="kpi-valor" style="font-size:17px">${numero(o.margem)}</div></div>
      </div>
      ${alertas(o).length?`<div class="aviso info">Atenção: ${alertas(o).map(a=>a.t).join(" · ")}</div>`:""}
      <div class="cartao" style="box-shadow:none; border:1px solid var(--borda)">
        <table><tbody>
          <tr><td>Cliente</td><td>${o.cliente||"—"}</td></tr>
          <tr><td>Objeto</td><td>${o.objeto||"—"}</td></tr>
          <tr><td>Contrato</td><td class="dados">${o.contrato||"—"}</td></tr>
          <tr><td>Local</td><td>${o.municipio||"—"}${o.uf?"/"+o.uf:""}</td></tr>
          <tr><td>CNO</td><td class="dados">${o.cno||"—"}</td></tr>
          <tr><td>ART/RRT</td><td class="dados">${o.art_rrt||"—"}</td></tr>
          <tr><td>Vigência até</td><td class="dados">${dataBR(o.vigencia_fim)}</td></tr>
          <tr><td>Data-base do orçamento</td><td class="dados">${dataBR(o.data_base)}</td></tr>
        </tbody></table>
      </div>
      <h4>Mudar fase</h4>
      <div class="form-grade">
        <div class="campo"><label>Nova fase</label><select id="nova-fase">
          ${FASES.map(f=>`<option value="${f.chave}" ${f.chave===o.fase?"selected":""}>${f.rotulo}</option>`).join("")}
        </select></div>
        <div class="campo" style="grid-column:span 2"><label>Observação</label>
          <input id="fase-obs" placeholder="ex.: OS recebida em 12/09"></div>
        <div class="campo" style="align-self:end"><button class="btn" id="btn-fase">Registrar fase</button></div>
      </div>`;
    els("btn-fase").addEventListener("click", async () => {
      try {
        await api(`/erp/api/obras/${id}/fase`, {method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({fase: els("nova-fase").value, observacao: els("fase-obs").value})});
        aviso("dlg-msg", "Fase registrada.", "ok"); carregar();
      } catch(e){ aviso("dlg-msg", e.message, "erro"); }
    });
    return;
  }

  if (i === 1 || i === 2 || i === 3) {   // cadastro / contrato / tributação
    const {obra: d} = await api(`/erp/api/obras/${id}`);
    const campo = (rot, id_, val, tipo="text") =>

// ---------------------------------------------------------------------------
// QUEM RESPONDE PELA OBRA
//
// A mesma informação que aparece no cadastro do operador, marcada pelo outro
// lado — o dono pediu os dois caminhos "porque facilita o manuseio". As duas
// telas gravam pela MESMA função no servidor, senão um dia discordariam sobre
// quem responde.
//
// Salva sozinho ao marcar: é uma caixinha só, e obrigar a apertar "salvar"
// depois de marcar uma caixinha é o tipo de passo que a pessoa esquece.
// ---------------------------------------------------------------------------
async function carregarResponsaveis(obraId){
  const lugar = els("o-responsaveis");
  if (!lugar) return;
  try {
    const d = await api(`/erp/api/obras/${obraId}/responsaveis`);
    const operadores = (await api("/erp/api/usuarios")).usuarios || [];
    const marcados = new Set(d.operadores.filter(o=>o.responsavel).map(o=>o.usuario_id));
    lugar.innerHTML = operadores.filter(u=>u.ativo).map(u=>`
      <label class="opcao"><input type="checkbox" class="o-resp" value="${u.id}"
        ${marcados.has(u.id)?"checked":""}>
        <span class="rotulo">${escapar(u.nome)}
          <small> · ${escapar(u.perfil_rotulo || "")}${u.telefone ? "" :
            " · sem telefone, não recebe mensagem"}</small></span></label>`).join("")
      || `<div class="cartao-dica">Nenhum operador ativo cadastrado.</div>`;
    lugar.querySelectorAll(".o-resp").forEach(c =>
      c.addEventListener("change", () => salvarResponsaveis(obraId)));
  } catch(e){
    lugar.innerHTML = `<div class="aviso erro">Não consegui carregar os
      operadores: ${escapar(e.message)}</div>`;
  }
}

async function salvarResponsaveis(obraId){
  const ids = [...document.querySelectorAll(".o-resp:checked")].map(c=>+c.value);
  try {
    await api(`/erp/api/obras/${obraId}/responsaveis`, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({responsaveis: ids})});
    aviso("mensagem", ids.length
      ? `${ids.length} pessoa(s) respondem por esta obra.`
      : "Ninguém responde por esta obra — a conferência mensal ficará sem dono.",
      ids.length ? "ok" : "alerta");
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

function salvarObra(id, mapa, extras){
  const b = els("o-salvar");
  if (!b) return;
  b.addEventListener("click", async () => {
    const corpo = {};
    Object.entries(mapa).forEach(([campo, elemento]) => {
      const el = els(elemento);
      if (el) corpo[campo] = el.value;
    });
    if (extras) Object.assign(corpo, extras());
    try {
      await api(`/erp/api/obras/${id}`, {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify(corpo)});
      aviso("dlg-msg", "Salvo.", "ok"); carregar();
    } catch(e){ aviso("dlg-msg", e.message, "erro"); }
  });
}

els("btn-mapa").addEventListener("click", async () => {
  try {
    const m = await api("/erp/api/mapa");
    const maxGasto = Math.max(...m.regioes.map(r=>r.gasto), 1);
    const comCoord = m.pontos.filter(p=>p.latitude && p.longitude);
    els("dlg-titulo").textContent = "Onde estão as obras e os equipamentos";
    els("dlg-corpo").innerHTML = `
      <div class="kpis">
        <div class="kpi estatico"><div class="kpi-rotulo">Obras ativas</div>
          <div class="kpi-valor">${m.total_obras}</div>
          <div class="kpi-sub">${m.regioes.length} município(s)</div></div>
        <div class="kpi estatico ambar"><div class="kpi-rotulo">Locado por período</div>
          <div class="kpi-valor" style="font-size:18px">${moeda(
            m.regioes.reduce((a,r)=>a+r.locado_periodo,0))}</div>
          <div class="kpi-sub">${m.regioes.reduce((a,r)=>a+r.equipamentos,0)} equipamento(s)</div></div>
        <div class="kpi estatico ciano"><div class="kpi-rotulo">Gasto acumulado</div>
          <div class="kpi-valor" style="font-size:18px">${moeda(
            m.regioes.reduce((a,r)=>a+r.gasto,0))}</div></div>
      </div>

      <h4>Por município</h4>
      <table><thead><tr><th>Município</th><th class="direita">Obras</th>
        <th class="direita">Contratado</th><th class="direita">Gasto</th>
        <th class="direita">Locado/período</th><th class="direita">Equip.</th>
        <th style="width:130px">Peso</th></tr></thead>
      <tbody>${m.regioes.map(r=>`<tr>
        <td><b>${r.municipio}</b>${r.uf?`<small>${r.uf}</small>`:""}</td>
        <td class="direita dados">${r.obras}</td>
        <td class="direita dados">${numero(r.valor_contrato)}</td>
        <td class="direita dados">${numero(r.gasto)}</td>
        <td class="direita dados">${numero(r.locado_periodo)}</td>
        <td class="direita dados">${r.equipamentos}</td>
        <td><span class="trilha" style="display:block"><span class="preench"
          style="width:${(r.gasto/maxGasto*100).toFixed(0)}%"></span></span></td>
      </tr>`).join("")}</tbody></table>

      ${comCoord.length ? `<h4>Mapa</h4>
        <div id="mapa-svg" style="border:1px solid var(--borda); border-radius:8px;
             background:var(--papel); padding:8px"></div>
        <div class="cartao-dica">Tamanho do círculo = gasto acumulado; âmbar = tem
          equipamento locado.</div>`
        : `<div class="cartao-dica">Nenhuma obra tem coordenada preenchida ainda.
           Informe latitude e longitude no cadastro da obra para ver o mapa —
           ${m.total_obras} obra(s) apareceriam aqui.</div>`}`;

    if (comCoord.length) {
      const lats = comCoord.map(p=>p.latitude), lngs = comCoord.map(p=>p.longitude);
      const minLa = Math.min(...lats), maxLa = Math.max(...lats);
      const minLo = Math.min(...lngs), maxLo = Math.max(...lngs);
      const L = 620, A = 380, pad = 40;
      const x = lo => pad + ((lo-minLo)/((maxLo-minLo)||1)) * (L-2*pad);
      const y = la => A - pad - ((la-minLa)/((maxLa-minLa)||1)) * (A-2*pad);
      const maxG = Math.max(...comCoord.map(p=>p.gasto), 1);
      els("mapa-svg").innerHTML = `<svg viewBox="0 0 ${L} ${A}" style="width:100%; height:auto">
        ${comCoord.map(p=>{
          const raio = 6 + Math.sqrt(p.gasto/maxG) * 22;
          const cor = p.locado_periodo > 0 ? "var(--amarelo)" : "var(--azul-claro)";
          return `<g>
            <circle cx="${x(p.longitude)}" cy="${y(p.latitude)}" r="${raio}"
              fill="${cor}" fill-opacity="0.55" stroke="var(--azul)" stroke-width="1.5">
              <title>${p.codigo} — ${p.municipio||""}
gasto ${moeda(p.gasto)}${p.locado_periodo?` · locado ${moeda(p.locado_periodo)}/período (${p.equipamentos} itens)`:""}</title>
            </circle>
            <text x="${x(p.longitude)}" y="${y(p.latitude)-raio-4}" text-anchor="middle"
              style="font-size:11px; font-weight:700; fill:var(--azul)">${p.codigo}</text>
          </g>`;}).join("")}
      </svg>`;
    }
    els("dlg").showModal();
  } catch(e){ aviso("mensagem", e.message, "erro"); }
});

// ---------------------------------------------------------------------------
// NOVA OBRA — de dois formulários para um, e um deles é o documento
//
// Havia "nova obra" em Configurações (oito campos) e aqui (cinco). A mesma
// obra nascia diferente conforme a porta de entrada, e quem entrava pela porta
// curta nem sabia que a outra existia. O dono decidiu em 10/09/2026: um lugar
// só, que é este — Configurações agora aponta para cá.
//
// E a segunda porta, que ele pediu na mesma conversa: criar a obra A PARTIR do
// documento. Manda o contrato (ou a CNO, a ART, a ordem de serviço), o sistema
// lê, propõe os campos, cria a obra e guarda o documento nela. Duas ações
// viram uma, que é o princípio que ele quer no sistema inteiro.
// ---------------------------------------------------------------------------
let NOVA_DOC = null;          // a leitura conferida, esperando confirmação

const CAMPOS_NOVA_OBRA = [
  {id:"codigo", rot:"Código *", dica:"ESCPE18"},
  {id:"nome", rot:"Nome *", largo:true},
  {id:"cliente", rot:"Contratante"},
  {id:"cnpj_cliente", rot:"CNPJ do contratante"},
  {id:"contrato", rot:"Nº do contrato"},
  {id:"objeto", rot:"Objeto", largo:true},
  {id:"municipio", rot:"Município"},
  {id:"uf", rot:"UF", tam:2},
  {id:"cno", rot:"Matrícula CNO"},
  {id:"valor_contrato", rot:"Valor do contrato"},
  {id:"aliquota_iss_pct", rot:"Alíquota de ISS (%)"},
];

function codigosRecentes(){
  return OBRAS.slice().sort((a,b)=>b.id-a.id).slice(0,4).map(o=>o.codigo);
}

els("btn-nova").addEventListener("click", () => {
  NOVA_DOC = null;
  els("dlg-titulo").textContent = "Nova obra";
  els("dlg-corpo").innerHTML = `<div id="dlg-msg"></div>
    <div class="topo-abas" style="background:var(--azul); border-radius:8px; padding:4px; margin-bottom:14px">
      <button class="topo-aba ativa" data-modo="doc" type="button">A partir de um documento</button>
      <button class="topo-aba" data-modo="mao" type="button">Digitando</button>
    </div>
    <div id="nova-corpo"></div>`;
  document.querySelectorAll("[data-modo]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-modo]").forEach(x=>x.classList.remove("ativa"));
    b.classList.add("ativa");
    NOVA_DOC = null;
    modoNovaObra(b.dataset.modo);
  }));
  modoNovaObra("doc");
  els("dlg").showModal();
});

function modoNovaObra(modo){
  const alvo = els("nova-corpo");
  if (modo === "mao") {
    alvo.innerHTML = `
      <div class="form-grade">
        ${CAMPOS_NOVA_OBRA.map(c=>`
          <div class="campo" ${c.largo?'style="grid-column:span 2"':""}>
            <label>${c.rot}</label>
            <input id="n-${c.id}" ${c.dica?`placeholder="${c.dica}"`:""}
              ${c.tam?`maxlength="${c.tam}"`:""}></div>`).join("")}
      </div>
      <div class="cartao-dica">Código e nome bastam para criar. O resto — vigência,
        tributação, ART, aditivos — se completa abrindo a obra depois.
        ${codigosRecentes().length
          ? `<br>Últimos códigos usados: <b class="mono">${escapar(codigosRecentes().join(", "))}</b>.` : ""}</div>
      <div style="margin-top:14px"><button class="btn" id="n-salvar" type="button">Criar obra</button></div>`;
    els("n-salvar").addEventListener("click", criarObraNaMao);
    return;
  }

  alvo.innerHTML = `
    <div class="cartao-dica">Mande o <b>contrato</b>, a <b>matrícula CNO</b>, a
      <b>ART</b> ou a <b>ordem de serviço</b>. O sistema lê, mostra o que
      entendeu, cria a obra e guarda o documento dentro dela — as duas coisas
      de uma vez.</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px">
      <input type="file" id="nd-arq" accept=".pdf,.png,.jpg,.jpeg,.webp">
      <input id="nd-dica" placeholder="ajuda (opcional): 'é o contrato da creche'"
        style="flex:1; min-width:200px; padding:7px 10px;
               border:1px solid var(--borda-forte); border-radius:8px; font-size:13px">
      <button class="btn" id="nd-ler" type="button">Ler o documento</button>
    </div>
    <div id="nd-leitura"></div>`;
  els("nd-ler").addEventListener("click", lerDocumentoDeObraNova);
  els("nd-arq").addEventListener("change", () => {
    NOVA_DOC = null; els("nd-leitura").innerHTML = "";
  });
}

async function criarObraNaMao(){
  const corpo = {};
  CAMPOS_NOVA_OBRA.forEach(c => { corpo[c.id] = (els("n-"+c.id).value || "").trim(); });
  const b = els("n-salvar");
  b.disabled = true;
  try {
    const d = await api("/erp/api/obras/nova", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(corpo)});
    await carregar();
    await mostrarObraNova(d.obra.id, `Obra <b>${escapar(d.obra.codigo)}</b> criada. `
      + `Complete aqui contrato, vigência e tributação.`);
  } catch(e){ aviso("dlg-msg", e.message, "erro"); }
  b.disabled = false;
}

// Abre a ficha da obra recém-criada com o recado DENTRO dela. Esperar o
// `abrir` importa: ele refaz o corpo do diálogo, e um aviso escrito antes
// sumiria sem a pessoa ler.
//
// A obra pode não estar na lista: quem enxerga por obra designada cria uma
// obra que ainda não foi designada a ele. Nesse caso não há ficha para abrir
// — e dizer isso é melhor que a tela travar sem explicação.
async function mostrarObraNova(id, recado){
  if (OBRAS.some(o => o.id === id)) {
    await abrir(id);
    aviso("dlg-msg", recado, "ok");
  } else {
    els("dlg").close();
    aviso("mensagem", recado + " Ela não aparece na sua lista porque o seu "
      + "acesso é por obra designada — peça para incluírem esta obra.", "ok");
  }
}

async function lerDocumentoDeObraNova(){
  const arq = els("nd-arq").files[0];
  if (!arq) { aviso("dlg-msg", "Escolha o arquivo antes de mandar ler.", "erro"); return; }
  const b = els("nd-ler");
  b.disabled = true; b.textContent = "Lendo…";
  els("nd-leitura").innerHTML = `<div class="cartao-dica">Lendo o documento…</div>`;
  try {
    const fd = new FormData();
    fd.append("arquivo", arq);
    if (els("nd-dica").value.trim()) fd.append("dica", els("nd-dica").value.trim());
    NOVA_DOC = await api("/erp/api/obras/documento/ler", {method:"POST", body: fd});
    NOVA_DOC.arquivo_lido = arq.name;
    desenharLeituraDeObraNova();
  } catch(e){
    NOVA_DOC = null;
    els("nd-leitura").innerHTML = `<div class="aviso erro">${escapar(e.message)}</div>`;
  }
  b.disabled = false; b.textContent = "Ler o documento";
}

function desenharLeituraDeObraNova(){
  const g = NOVA_DOC.sugestao, c = NOVA_DOC.cadastro;
  const cor = {ALTA:"ok", MEDIA:"alerta", BAIXA:"erro"}[g.confianca] || "alerta";
  const linhas = (c.campos || []).map(x => `
    <tr>
      <td style="width:34px"><input type="checkbox" data-ncampo="${escapar(x.campo)}"
          ${x.marcar ? "checked" : ""}></td>
      <td>${escapar(x.rotulo)}</td>
      <td><input data-nvalor="${escapar(x.campo)}" value="${escapar(x.valor)}"
           style="width:100%; padding:5px 8px; border:1px solid var(--borda-forte);
                  border-radius:6px; font-size:13px"></td>
    </tr>`).join("");

  const p = c.parecidas || [], a = c.aditivo;
  els("nd-leitura").innerHTML = `
    <div class="aviso ${cor}" style="margin-top:12px">
      <b>${escapar(g.tipo_nome || "Tipo não reconhecido")}</b>
      ${g.tipo_motivo ? ` — ${escapar(g.tipo_motivo)}` : ""}
      ${g.observacoes ? `<br><i>${escapar(g.observacoes)}</i>` : ""}
    </div>

    ${p.length ? `<div class="aviso erro">
      <b>Atenção: isto pode já estar cadastrado.</b>
      <ul style="margin:6px 0 0 18px">${p.map(o=>`<li><b class="mono">${escapar(o.codigo)}</b>
        — ${escapar(o.nome)} <small>(${o.motivos.map(escapar).join("; ")})</small></li>`).join("")}</ul>
      Duas obras para o mesmo contrato partem o histórico em dois: metade dos
      títulos numa, metade na outra, e nenhum relatório fecha. Se for a mesma
      obra, feche aqui e mande o documento pela ficha dela.
      <label class="opcao" style="margin-top:8px"><input type="checkbox" id="nd-confirmar">
        <span class="rotulo">Sei que é outra obra — pode criar assim mesmo</span></label>
    </div>` : ""}

    <div class="form-grade" style="margin-top:12px">
      <div class="campo"><label>Código da obra *</label>
        <input id="nd-codigo" placeholder="ESCPE18">
        ${codigosRecentes().length
          ? `<small style="color:var(--tinta-suave)">últimos usados:
              ${escapar(codigosRecentes().join(", "))}</small>` : ""}</div>
      <div class="campo" style="grid-column:span 2"><label>Nome da obra *</label>
        <input id="nd-nome" value="${escapar(c.nome_sugerido || "")}"></div>
    </div>
    <div class="cartao-dica">O código é convenção da casa — não sai de documento
      nenhum, e é por isso que o sistema pergunta em vez de inventar.</div>

    ${c.tipo_nao_preenche
      ? `<div class="cartao-dica">Este tipo de documento não alimenta o cadastro
          da obra — vai ser só arquivado nela, e está certo assim.</div>`
      : linhas
        ? `<div class="cartao" style="box-shadow:none; border:1px solid var(--borda); padding:0">
            <div style="padding:10px 12px"><b>O que vai para o cadastro</b>
              <small style="color:var(--tinta-suave)"> — desmarque o que não quiser</small></div>
            <table><tbody>${linhas}</tbody></table></div>`
        : `<div class="cartao-dica">O documento não trouxe nada para o cadastro:
            a obra nasce só com código e nome.</div>`}

    ${a ? `<div class="cartao" style="box-shadow:none; border:1px solid var(--borda);
         border-left:4px solid var(--roxo)">
      <label class="opcao" style="margin:0"><input type="checkbox" id="nd-aditivo" checked>
        <span class="rotulo"><b>Registrar o aditivo ${escapar(a.numero || "sem número")}</b></span></label>
      <div class="cartao-dica">${escapar(a.tipo)} ·
        ${a.valor ? `R$ ${escapar(a.valor)}` : "sem valor"} ·
        ${a.dias ? `${a.dias} dia(s)` : "sem prazo"}</div>
    </div>` : ""}

    <div style="margin-top:10px; display:flex; gap:8px; align-items:center">
      <button class="btn amarelo" id="nd-criar" type="button">Criar a obra e arquivar</button>
      <button class="link-btn" id="nd-cancelar" type="button">Descartar leitura</button>
    </div>
    <div id="nd-msg"></div>`;

  els("nd-criar").addEventListener("click", criarObraDoDocumento);
  els("nd-cancelar").addEventListener("click", () => {
    NOVA_DOC = null; els("nd-leitura").innerHTML = "";
  });
}

async function criarObraDoDocumento(){
  const arq = els("nd-arq").files[0];
  if (!arq || !NOVA_DOC) { aviso("nd-msg", "Leia o documento antes.", "erro"); return; }
  if (NOVA_DOC.arquivo_lido !== arq.name) {
    aviso("nd-msg", "O arquivo mudou depois da leitura. Leia de novo.", "erro"); return;
  }
  const g = NOVA_DOC.sugestao;
  if (!g.tipo_codigo) {
    aviso("nd-msg", "A leitura não reconheceu o tipo do documento. "
      + "Crie a obra digitando e mande o documento pela ficha dela.", "erro");
    return;
  }
  const codigo = (els("nd-codigo").value || "").trim();
  const nome = (els("nd-nome").value || "").trim();
  if (!codigo || !nome) {
    aviso("nd-msg", "Preencha o código e o nome da obra.", "erro"); return;
  }
  const campos = {};
  document.querySelectorAll("[data-ncampo]:checked").forEach(cx => {
    const campo = cx.dataset.ncampo;
    const entrada = document.querySelector(`[data-nvalor="${campo}"]`);
    if (entrada && entrada.value.trim()) campos[campo] = entrada.value.trim();
  });

  const b = els("nd-criar");
  b.disabled = true; b.textContent = "Criando…";
  try {
    const fd = new FormData();
    fd.append("arquivo", arq);
    fd.append("tipo", g.tipo_codigo);
    fd.append("codigo", codigo); fd.append("nome", nome);
    ["referencia","emissao","validade","competencia","texto","resumo"].forEach(k => {
      if (g[k]) fd.append(k, g[k]);
    });
    fd.append("campos", JSON.stringify(campos));
    const conf = els("nd-confirmar");
    if (conf && conf.checked) fd.append("confirmar_duplicada", "1");
    const quer = els("nd-aditivo");
    if (NOVA_DOC.cadastro.aditivo && quer && quer.checked) {
      const ad = {...NOVA_DOC.cadastro.aditivo, valor: NOVA_DOC.cadastro.aditivo.valor_bruto};
      fd.append("aditivo", JSON.stringify(ad));
    }
    const d = await api("/erp/api/obras/documento", {method:"POST", body: fd});
    let recado = `Obra <b>${escapar(d.obra.codigo)}</b> criada. `
      + `Documento guardado como <b class="mono">${escapar(d.documento.nome)}</b>.`;
    if (d.preenchido.quantidade)
      recado += ` ${d.preenchido.quantidade} campo(s) preenchido(s): `
        + d.preenchido.mudancas.map(escapar).join("; ") + ".";
    if (d.aditivo) recado += ` Aditivo ${escapar(d.aditivo.numero)} registrado.`;
    NOVA_DOC = null;
    await carregar();
    await mostrarObraNova(d.obra.id, recado);
  } catch(e){
    // O 400 da guarda de duplicidade vem com a lista junto: melhor mostrar as
    // obras parecidas do que só dizer "já existe".
    const p = (e.dados && e.dados.parecidas) || [];
    aviso("nd-msg", escapar(e.message) + (p.length
      ? " — " + p.map(o=>`${escapar(o.codigo)} (${o.motivos.map(escapar).join("; ")})`).join(", ")
      : ""), "erro");
  }
  b.disabled = false; b.textContent = "Criar a obra e arquivar";
}

let deb; els("f-busca").addEventListener("input", ()=>{clearTimeout(deb); deb=setTimeout(desenhar,250);});
["f-vigencia","f-reajuste","f-fiscal","f-margem"].forEach(i=>els(i).addEventListener("change", desenhar));
els("btn-limpar").addEventListener("click", ()=>{
  F.fase.clear(); els("f-busca").value="";
  ["f-vigencia","f-reajuste","f-fiscal","f-margem"].forEach(i=>els(i).checked=false);
  montarFiltros(); desenhar();
});
document.querySelectorAll("thead th[data-ordem]").forEach(th=>th.addEventListener("click",()=>{
  ORDEM={campo:th.dataset.ordem, asc:ORDEM.campo===th.dataset.ordem?!ORDEM.asc:true};
  document.querySelectorAll("thead .seta").forEach(s=>s.remove());
  th.insertAdjacentHTML("beforeend",`<span class="seta"> ${ORDEM.asc?"▲":"▼"}</span>`);
  desenhar();
}));
// ENCADEAMENTO: veio de um título, de um contrato ou de um relatório com
// ?obra=N no endereço — a ficha da obra abre sozinha, sem obrigar a procurar
// de novo numa lista de dezenas.
carregar().then(() => {
  const pedida = new URLSearchParams(location.search).get("obra");
  if (!pedida) return;
  const id = +pedida;
  if (OBRAS.some(o => o.id === id)) abrir(id);
  else aviso("mensagem", "Esta obra não aparece na sua lista — ou foi apagada, "
    + "ou está fora das obras que você acompanha.", "erro");
});

// Excel e PDF do que está na tela, com os filtros no cabeçalho.
botoesDeExportar("exportar");
</script>
