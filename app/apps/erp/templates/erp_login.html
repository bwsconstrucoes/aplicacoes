<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP BWS — entrar</title>
<link rel="stylesheet" href="{{ url_for('erp.static', filename='erp.css') }}">
</head>
<body>
<main class="entrada">
  <form method="post" action="{{ url_for('erp.pagina_login') }}">
    <div class="marca">
      <div class="brasao">BWS</div>
      <div>
        <h1>ERP Financeiro</h1>
        <p class="sub">Contas a pagar · BWS Construções</p>
      </div>
    </div>
    {% if erro %}<div class="aviso erro">{{ erro }}</div>{% endif %}
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
