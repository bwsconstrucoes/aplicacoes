{% extends "erp_base.html" %}
{% block titulo %}Títulos — ERP BWS{% endblock %}

{% block filtros %}
  <div class="filtros-cab">
    <h2>Filtros</h2>
    <button class="link-btn" id="btn-limpar">Limpar</button>
  </div>
  <div class="busca">
    <span class="lupa">⌕</span>
    <input id="f-busca" type="search" placeholder="SP, credor, descrição…">
  </div>
  <div class="filtro aberto" id="filtro-status">
    <button class="filtro-cab" type="button"><span>Situação</span>
      <span class="filtro-badge" id="badge-status">0</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div class="filtro-opcoes" id="opcoes-status"></div></div>
  </div>
  <div class="filtro aberto" id="filtro-obra">
    <button class="filtro-cab" type="button"><span>Obra</span>
      <span class="filtro-badge" id="badge-obra">0</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div class="filtro-opcoes" id="opcoes-obra"></div></div>
  </div>
  <div class="filtro aberto" id="filtro-credor">
    <button class="filtro-cab" type="button"><span>Credor</span>
      <span class="filtro-badge" id="badge-credor">0</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div class="filtro-opcoes" id="opcoes-credor"></div></div>
  </div>
  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Vencimento e valor</span><span class="seta">▾</span></button>
    <div class="filtro-cont">
      <label class="opcao"><input type="checkbox" id="f-venc7"><span class="rotulo">Vence em até 7 dias</span></label>
      <label class="opcao"><input type="checkbox" id="f-atrasados"><span class="rotulo">Somente atrasados</span></label>
      <div class="faixa" style="margin-top:8px">
        <div><label>Valor mín.</label><input id="f-min" inputmode="decimal" placeholder="0,00"></div>
        <div><label>Valor máx.</label><input id="f-max" inputmode="decimal" placeholder="0,00"></div>
      </div>
    </div>
  </div>
{% endblock %}

{% block conteudo %}
<div id="mensagem"></div>
<div class="kpis" id="kpis"></div>
<div class="chips" id="chips"></div>

<div class="tabela-wrap">
  <div class="tabela-barra">
    <span class="resumo" id="resumo-tabela"></span>
    <span class="espaco"></span>
    <span id="acoes-lote" class="oculto" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <input id="motivo" placeholder="Motivo (devolver / cancelar)" style="padding:7px 10px; border:1px solid var(--borda-forte); border-radius:8px; font-size:13px; min-width:220px">
      <button class="btn" data-acao="aprovar">✔ Liberar p/ pagamento</button>
      <button class="btn secundario" data-acao="devolver">↩ Devolver ao solicitante</button>
      <button class="btn perigo" data-acao="cancelar">✕ Cancelar SP</button>
      <button class="btn secundario" data-acao="reclassificar">↔ Reclassificar</button>
      <button class="btn secundario" data-acao="desfazer">⟲ Desfazer baixa</button>
    </span>
  </div>
  <div class="tabela-rolagem">
    <table>
      <thead><tr>
        <th class="sem-ordem" style="width:34px"><input type="checkbox" id="marca-todos"></th>
        <th data-ordem="numero_sp">SP</th>
        <th data-ordem="fornecedor">Credor</th>
        <th class="sem-ordem">Descrição</th>
        <th class="sem-ordem">Obra</th>
        <th data-ordem="vencimento">Vencimento</th>
        <th class="direita" data-ordem="valor_liquido">Valor</th>
        <th data-ordem="risco">Risco</th>
        <th data-ordem="status">Situação</th>
      </tr></thead>
      <tbody id="corpo-tabela"></tbody>
    </table>
  </div>
  <div class="vazio oculto" id="vazio"></div>
</div>

<dialog id="dlg">
  <div class="dlg-topo"><h3 id="dlg-titulo">—</h3>
    <button class="topo-btn" style="margin-left:auto" onclick="els('dlg').close()">Fechar</button></div>
  <div class="dlg-corpo" id="dlg-corpo"></div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
const SITUACOES = ["EM_ANALISE","AGUARDANDO_APROVACAO","APROVADO","BLOQUEADO","PAGO_PARCIAL",
                   "PAGO","DEVOLVIDO","CANCELADO","ESTORNADO","RASCUNHO"];
const ABERTOS = ["EM_ANALISE","AGUARDANDO_APROVACAO","APROVADO","BLOQUEADO","PAGO_PARCIAL"];
const ROTULOS = {EM_ANALISE:"Em análise", AGUARDANDO_APROVACAO:"Aguardando autorização",
  APROVADO:"Liberado p/ pagamento", BLOQUEADO:"Bloqueado na análise", PAGO_PARCIAL:"Pago parcial",
  PAGO:"Pago", DEVOLVIDO:"Devolvido", CANCELADO:"Cancelado", ESTORNADO:"Estornado", RASCUNHO:"Rascunho"};
let TITULOS = [], SELECAO = new Set(), ORDEM = {campo:"vencimento", asc:true};
let F = {status: new Set(ABERTOS), obra: new Set(), credor: new Set()};

document.querySelectorAll(".filtro-cab").forEach(b =>
  b.addEventListener("click", () => b.closest(".filtro").classList.toggle("aberto")));

function classeSelo(s){
  if(["AGUARDANDO_APROVACAO","EM_ANALISE"].includes(s)) return "aguardando";
  if(s==="APROVADO") return "aprovado";
  if(s==="BLOQUEADO") return "bloqueado";
  if(["PAGO","PAGO_PARCIAL"].includes(s)) return "pago";
  return "outro";
}

async function carregar(){
  try {
    const d = await api("/erp/api/titulos?status=" + [...F.status].join(","));
    TITULOS = d.titulos;
    montarFiltros();
    desenhar();
  } catch(e) { aviso("mensagem", "Não foi possível carregar: " + e.message, "erro"); }
}

function montarFiltros(){
  const cont = (campo) => {
    const m = {};
    TITULOS.forEach(t => { const v = t[campo]; if(v) m[v] = (m[v]||0)+1; });
    return m;
  };
  // situação (do universo fixo)
  const cs = cont("status");
  els("opcoes-status").innerHTML = SITUACOES.map(s =>
    `<label class="opcao ${cs[s]?"":"zerada"}"><input type="checkbox" data-f="status" value="${s}"
      ${F.status.has(s)?"checked":""}><span class="rotulo">${ROTULOS[s]||s}</span>
      <span class="qtd">${cs[s]||0}</span></label>`).join("");
  const co = cont("obra");
  els("opcoes-obra").innerHTML = Object.keys(co).sort().map(o =>
    `<label class="opcao"><input type="checkbox" data-f="obra" value="${o}" ${F.obra.has(o)?"checked":""}>
      <span class="rotulo">${o}</span><span class="qtd">${co[o]}</span></label>`).join("")
      || `<div class="cartao-dica">sem obras nos títulos carregados</div>`;
  const cc = cont("fornecedor");
  els("opcoes-credor").innerHTML = Object.keys(cc).sort().map(c =>
    `<label class="opcao"><input type="checkbox" data-f="credor" value="${c}" ${F.credor.has(c)?"checked":""}>
      <span class="rotulo">${c}</span><span class="qtd">${cc[c]}</span></label>`).join("");
  ["status","obra","credor"].forEach(k => els("badge-"+k).textContent = F[k].size);
  document.querySelectorAll('[data-f]').forEach(i => i.addEventListener("change", ev => {
    const {f, value} = {f: ev.target.dataset.f, value: ev.target.value};
    ev.target.checked ? F[f].add(value) : F[f].delete(value);
    if (f === "status") carregar(); else { montarFiltros(); desenhar(); }
  }));
}

function visiveis(){
  const min = parseFloat((els("f-min").value||"").replace(/\./g,"").replace(",","."));
  const max = parseFloat((els("f-max").value||"").replace(/\./g,"").replace(",","."));
  const lim7 = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const busca = (els("f-busca").value||"").toLowerCase().trim();
  let l = TITULOS.filter(t => {
    if (F.obra.size && !F.obra.has(t.obra)) return false;
    if (F.credor.size && !F.credor.has(t.fornecedor)) return false;
    if (!isNaN(min) && t.valor_liquido < min) return false;
    if (!isNaN(max) && t.valor_liquido > max) return false;
    if (els("f-venc7").checked && !(t.vencimento && t.vencimento <= lim7 && ABERTOS.includes(t.status))) return false;
    if (els("f-atrasados").checked && !t.vencido) return false;
    if (busca && !(`${t.numero_sp} ${t.fornecedor} ${t.descricao} ${t.categoria}`.toLowerCase().includes(busca))) return false;
    return true;
  });
  const {campo, asc} = ORDEM;
  return l.sort((a,b) => {
    let x=a[campo], y=b[campo];
    if(x==null) return 1; if(y==null) return -1;
    return typeof x === "string" ? (asc? x.localeCompare(y,"pt-BR") : y.localeCompare(x,"pt-BR")) : (asc? x-y : y-x);
  });
}

function desenhar(){
  const l = visiveis();
  const soma = f => l.filter(f).reduce((a,t)=>a+t.valor_liquido,0);
  const qtd  = f => l.filter(f).length;
  const hoje = new Date().toISOString().slice(0,10);
  const lim7 = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  els("kpis").innerHTML = `
    <button class="kpi estatico"><div class="kpi-rotulo">Em tela</div>
      <div class="kpi-valor">${l.length}</div><div class="kpi-sub">${moeda(soma(()=>true))}</div></button>
    <button class="kpi ambar" data-kpi="AGUARDANDO_APROVACAO"><div class="kpi-rotulo">Aguardando autorização</div>
      <div class="kpi-valor">${qtd(t=>t.status==="AGUARDANDO_APROVACAO")}</div>
      <div class="kpi-sub">${moeda(soma(t=>t.status==="AGUARDANDO_APROVACAO"))}</div></button>
    <button class="kpi vermelho" data-kpi="BLOQUEADO"><div class="kpi-rotulo">Bloqueados</div>
      <div class="kpi-valor">${qtd(t=>t.status==="BLOQUEADO")}</div>
      <div class="kpi-sub">${moeda(soma(t=>t.status==="BLOQUEADO"))}</div></button>
    <button class="kpi verde" data-kpi="APROVADO"><div class="kpi-rotulo">Liberados p/ pagar</div>
      <div class="kpi-valor">${qtd(t=>t.status==="APROVADO")}</div>
      <div class="kpi-sub">${moeda(soma(t=>t.status==="APROVADO"))}</div></button>
    <button class="kpi ciano" data-kpi="_venc7"><div class="kpi-rotulo">Vencem em 7 dias</div>
      <div class="kpi-valor">${qtd(t=>t.vencimento&&t.vencimento<=lim7&&ABERTOS.includes(t.status))}</div>
      <div class="kpi-sub">${moeda(soma(t=>t.vencimento&&t.vencimento<=lim7&&ABERTOS.includes(t.status)))}</div></button>
    <button class="kpi roxo" data-kpi="_atraso"><div class="kpi-rotulo">Atrasados</div>
      <div class="kpi-valor">${qtd(t=>t.vencido)}</div>
      <div class="kpi-sub">${moeda(soma(t=>t.vencido))}</div></button>`;
  document.querySelectorAll("[data-kpi]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.kpi;
    if (k === "_venc7") { els("f-venc7").checked = !els("f-venc7").checked; }
    else if (k === "_atraso") { els("f-atrasados").checked = !els("f-atrasados").checked; }
    else { F.status = new Set([k]); carregar(); return; }
    desenhar();
  }));

  // chips
  const chips = [];
  if (els("f-busca").value.trim()) chips.push(["busca", els("f-busca").value.trim()]);
  F.status.forEach(s => chips.push(["status", ROTULOS[s]||s, s]));
  F.obra.forEach(o => chips.push(["obra", o, o]));
  F.credor.forEach(c => chips.push(["credor", c, c]));
  if (els("f-venc7").checked) chips.push(["venc7", "vence em 7 dias"]);
  if (els("f-atrasados").checked) chips.push(["atraso", "atrasados"]);
  els("chips").innerHTML = chips.map(([t,r,v]) =>
    `<span class="chip"><small>${t}</small>${r}<button data-chip="${t}" data-valor="${v||""}">×</button></span>`).join("")
    + `<span class="resumo">${l.length} de <b>${TITULOS.length}</b> carregados</span>`;
  document.querySelectorAll("[data-chip]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.chip, v = b.dataset.valor;
    if (["status","obra","credor"].includes(t)) { F[t].delete(v); if(t==="status") return carregar(); }
    if (t === "busca") els("f-busca").value = "";
    if (t === "venc7") els("f-venc7").checked = false;
    if (t === "atraso") els("f-atrasados").checked = false;
    montarFiltros(); desenhar();
  }));

  // tabela
  els("vazio").classList.toggle("oculto", l.length > 0);
  if (!l.length) els("vazio").innerHTML = TITULOS.length
    ? "<b>Nenhum título nestes filtros</b>Ajuste a situação ou o período à esquerda."
    : "<b>Nada lançado ainda</b>Importe as SPs do Pipefy na aba Importar, ou lance uma solicitação.";
  els("corpo-tabela").innerHTML = l.map(t => `
    <tr class="${SELECAO.has(t.id)?"marcada":""}" data-id="${t.id}">
      <td><input type="checkbox" data-sel="${t.id}" ${SELECAO.has(t.id)?"checked":""}></td>
      <td class="dados">${t.numero_sp}</td>
      <td>${t.fornecedor}</td>
      <td class="desc">${t.descricao}<small>${t.categoria}</small></td>
      <td>${t.obra||"—"}</td>
      <td class="dados ${t.vencido?"atrasado":""}">${dataBR(t.vencimento)}${t.parcelas>1?` <small>(${t.parcelas}x)</small>`:""}</td>
      <td class="direita dados">${numero(t.valor_liquido)}</td>
      <td><span class="risco"><span class="trilha"><span class="preench ${t.risco?"":"zero"}"
        style="width:${Math.min(t.risco,60)/60*100}%"></span></span><span>${t.risco}</span></span></td>
      <td><span class="selo ${classeSelo(t.status)}">${ROTULOS[t.status]||t.status}</span></td>
    </tr>`).join("");
  document.querySelectorAll("[data-sel]").forEach(c => c.addEventListener("change", ev => {
    const id = +ev.target.dataset.sel;
    ev.target.checked ? SELECAO.add(id) : SELECAO.delete(id);
    desenhar();
  }));
  document.querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("dblclick", () => detalhe(+tr.dataset.id)));

  const sel = TITULOS.filter(t => SELECAO.has(t.id));
  els("acoes-lote").classList.toggle("oculto", sel.length === 0);
  els("resumo-tabela").innerHTML = sel.length
    ? `<b>${sel.length}</b> selecionado(s) · <b>${moeda(sel.reduce((a,t)=>a+t.valor_liquido,0))}</b>`
    : `<b>${l.length}</b> título(s) · <b>${moeda(l.reduce((a,t)=>a+t.valor_liquido,0))}</b>`;
  els("marca-todos").checked = l.length>0 && l.every(t => SELECAO.has(t.id));
}

async function detalhe(id){
  try {
    const {titulo: t} = await api(`/erp/api/titulos/${id}`);
    const c = t.cabecalho;
    els("dlg-titulo").textContent = `${c.numero_sp} — ${c.fornecedor}`;
    els("dlg-corpo").innerHTML = `
      <div class="kpis">
        <div class="kpi estatico"><div class="kpi-rotulo">Situação</div><div class="kpi-valor" style="font-size:15px">${ROTULOS[c.status]||c.status}</div></div>
        <div class="kpi estatico"><div class="kpi-rotulo">Bruto</div><div class="kpi-valor" style="font-size:17px">${numero(t.bruto)}</div></div>
        <div class="kpi estatico ambar"><div class="kpi-rotulo">Retenções</div><div class="kpi-valor" style="font-size:17px">${numero(t.retencoes_total)}</div></div>
        <div class="kpi estatico verde"><div class="kpi-rotulo">Líquido</div><div class="kpi-valor" style="font-size:17px">${numero(c.valor_liquido)}</div></div>
      </div>
      <div class="cartao-dica">${c.categoria} · ${t.forma_pagamento} · competência ${c.competencia}${t.dedutivel?"":" · <b>INDEDUTÍVEL</b>"}</div>
      ${t.criticas.length ? `<h4>Análise automática</h4>` + t.criticas.map(k =>
        `<div class="critica ${k.severidade}"><code>${k.codigo}</code>${k.msg}</div>`).join("") : ""}
      <h4>Parcelas</h4><div class="cartao" style="padding:0"><table><thead><tr><th>Nº</th><th>Vencimento</th>
        <th class="direita">Valor</th><th>Situação</th><th>Boleto</th></tr></thead><tbody>
        ${t.parcelas.map(p=>`<tr><td class="dados">${p.numero}</td><td class="dados">${p.vencimento}</td>
        <td class="direita dados">${numero(p.valor)}</td><td>${rotulo(p.status)}</td>
        <td class="dados">${p.boleto||"—"}</td></tr>`).join("")}</tbody></table></div>
      <h4>Rateio por obra</h4><div class="cartao" style="padding:0"><table><thead><tr><th>Obra</th>
        <th class="direita">Valor</th><th class="direita">%</th></tr></thead><tbody>
        ${t.rateios.map(r=>`<tr><td>${r.obra}</td><td class="direita dados">${numero(r.valor)}</td>
        <td class="direita dados">${r.percentual.toFixed(2)}%</td></tr>`).join("")}</tbody></table></div>
      ${t.retencoes.length?`<h4>Retenções</h4><div class="cartao" style="padding:0"><table><thead><tr><th>Tipo</th>
        <th class="direita">Base</th><th class="direita">Alíq.</th><th class="direita">Valor</th></tr></thead><tbody>
        ${t.retencoes.map(r=>`<tr><td>${r.tipo}</td><td class="direita dados">${numero(r.base)}</td>
        <td class="direita dados">${r.aliquota}%</td><td class="direita dados">${numero(r.valor)}</td></tr>`).join("")}
        </tbody></table></div>`:""}
      <h4>Trilha de auditoria</h4><div class="cartao" style="padding:0"><table><thead><tr><th>Quando</th>
        <th>Ação</th><th>Detalhe</th></tr></thead><tbody>
        ${t.trilha.map(e=>`<tr><td class="dados">${e.quando}</td><td>${e.acao}</td>
        <td><small>${JSON.stringify(e.detalhe)}</small></td></tr>`).join("")}</tbody></table></div>`;
    els("dlg").showModal();
  } catch(e) { aviso("mensagem", e.message, "erro"); }
}

async function executar(acao){
  const ids = [...SELECAO], motivo = els("motivo").value.trim();
  if (["devolver","cancelar"].includes(acao) && motivo.length < 10) {
    aviso("mensagem", "Informe o motivo (mínimo 10 caracteres) antes de devolver ou cancelar.", "erro");
    els("motivo").focus(); return;
  }
  try {
    const d = await api("/erp/api/titulos/acao", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({acao, ids, motivo})});
    let m = `${d.processados.length} título(s) processado(s)${d.processados.length?": "+d.processados.join(", "):"."}`;
    if (d.erros.length) m += `<br><b>${d.erros.length} não passou(aram):</b><br>` + d.erros.map(e=>`#${e.id}: ${e.erro}`).join("<br>");
    aviso("mensagem", m, d.erros.length ? "info" : "ok");
    SELECAO.clear(); els("motivo").value = "";
    carregar();
  } catch(e) { aviso("mensagem", e.message, "erro"); }
}

let deb;
els("f-busca").addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(desenhar, 250); });
["f-min","f-max","f-venc7","f-atrasados"].forEach(id => els(id).addEventListener("input", desenhar));
els("btn-limpar").addEventListener("click", () => {
  F = {status: new Set(ABERTOS), obra: new Set(), credor: new Set()};
  ["f-busca","f-min","f-max"].forEach(i => els(i).value = "");
  els("f-venc7").checked = els("f-atrasados").checked = false;
  carregar();
});
els("marca-todos").addEventListener("change", ev => {
  visiveis().forEach(t => ev.target.checked ? SELECAO.add(t.id) : SELECAO.delete(t.id));
  desenhar();
});
document.querySelectorAll("[data-acao]").forEach(b => b.addEventListener("click", () => {
  const a = b.dataset.acao;
  if (a === "reclassificar") return reclassificar();
  if (a === "desfazer") return desfazer();
  executar(a);
}));

async function reclassificar(){
  if (SELECAO.size !== 1) { aviso("mensagem","Selecione um título para reclassificar.","erro"); return; }
  const id = [...SELECAO][0];
  const t = TITULOS.find(x=>x.id===id);
  let cats = [], obras = [];
  try {
    const d = await api("/erp/api/lancamento/dados");
    cats = d.dados.categorias; obras = d.dados.obras;
  } catch(e){ aviso("mensagem", e.message, "erro"); return; }
  const porGrupo = {};
  cats.forEach(c => (porGrupo[c.grupo] = porGrupo[c.grupo]||[]).push(c));
  els("dlg-titulo").textContent = `Reclassificar ${t.numero_sp}`;
  els("dlg-corpo").innerHTML = `<div id="dlg-msg"></div>
    <div class="aviso info">Trocar a conta ou a obra <b>não desfaz baixa nem conciliação</b>:
      o dinheiro saiu igual, muda só a classificação. A alteração fica na trilha.</div>
    <div class="cartao-dica">${t.descricao} · ${t.fornecedor} · ${moeda(t.valor_liquido)} ·
      situação <b>${ROTULOS[t.status]||t.status}</b></div>
    <div class="form-grade" style="margin-top:12px">
      <div class="campo" style="grid-column:span 2"><label>Nova conta do plano</label>
        <select id="rc-cat"><option value="">— manter ${t.categoria} —</option>
        ${Object.keys(porGrupo).map(g=>`<optgroup label="${g}">` +
          porGrupo[g].map(c=>`<option value="${c.id}">${c.codigo} · ${c.descricao}</option>`).join("") +
          `</optgroup>`).join("")}</select></div>
      <div class="campo"><label>Nova obra (rateio integral)</label>
        <select id="rc-obra"><option value="">— manter ${t.obra||"atual"} —</option>
        ${obras.map(o=>`<option value="${o.id}">${o.codigo} · ${o.nome}</option>`).join("")}</select>
        <div class="dica">Para dividir entre várias obras, use o detalhe do título.</div></div>
      <div class="campo" style="grid-column:span 2"><label>Motivo *</label>
        <input id="rc-motivo" placeholder="ex.: classificado como material, era locação"></div>
    </div>
    <div style="margin-top:14px"><button class="btn" id="rc-salvar">Reclassificar</button></div>`;
  els("rc-salvar").addEventListener("click", async () => {
    const corpo = {motivo: els("rc-motivo").value};
    if (els("rc-cat").value) corpo.categoria_id = +els("rc-cat").value;
    if (els("rc-obra").value) corpo.rateios = [{obra_id:+els("rc-obra").value, valor: t.valor_liquido}];
    try {
      const d = await api(`/erp/api/titulos/${id}/reclassificar`, {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify(corpo)});
      els("dlg").close();
      aviso("mensagem", `${d.relatorio.numero_sp} reclassificado: ${d.relatorio.mudancas.join("; ")}.
        <br><small>${d.relatorio.preservado}</small>`, "ok");
      SELECAO.clear(); carregar();
    } catch(e){ aviso("dlg-msg", e.message, "erro"); }
  });
  els("dlg").showModal();
}

async function desfazer(){
  if (SELECAO.size !== 1) { aviso("mensagem","Selecione um título para desfazer a baixa.","erro"); return; }
  const id = [...SELECAO][0];
  try {
    const {diagnostico: g} = await api(`/erp/api/titulos/${id}/desfazer`);
    els("dlg-titulo").textContent = `Desfazer baixa de ${g.numero_sp}`;
    els("dlg-corpo").innerHTML = `<div id="dlg-msg"></div>
      <div class="aviso info">Em um passo só, na ordem certa. O que será desfeito:
        <ul style="margin:6px 0 0 18px">${g.passos.map(p=>`<li>${p}</li>`).join("")}</ul></div>
      <div class="cartao-dica">Situação atual: <b>${g.status}</b> ·
        ${g.parcelas_pagas} de ${g.parcelas} parcela(s) paga(s) ·
        ${g.pagamentos.length} pagamento(s) · ${g.conciliacoes} conciliação(ões).
        Tudo fica registrado na trilha.</div>
      <div class="form-grade" style="margin-top:12px">
        <div class="campo"><label>Devolver o título para</label><select id="df-ate">
          <option value="APROVADO">Aprovado (pronto para nova baixa)</option>
          <option value="RASCUNHO">Rascunho (corrigir o lançamento)</option></select></div>
        <div class="campo" style="grid-column:span 2"><label>Motivo *</label>
          <input id="df-motivo" placeholder="ex.: baixa lançada na data errada"></div>
      </div>
      <div style="margin-top:14px"><button class="btn perigo" id="df-ok">Desfazer</button></div>`;
    els("df-ok").addEventListener("click", async () => {
      try {
        const d = await api(`/erp/api/titulos/${id}/desfazer`, {method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({motivo: els("df-motivo").value, ate: els("df-ate").value})});
        els("dlg").close();
        aviso("mensagem", `${d.relatorio.numero_sp}: ${d.relatorio.passos.join(" · ")}.`, "ok");
        SELECAO.clear(); carregar();
      } catch(e){ aviso("dlg-msg", e.message, "erro"); }
    });
    els("dlg").showModal();
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}
document.querySelectorAll("thead th[data-ordem]").forEach(th => th.addEventListener("click", () => {
  ORDEM = {campo: th.dataset.ordem, asc: ORDEM.campo === th.dataset.ordem ? !ORDEM.asc : true};
  document.querySelectorAll("thead .seta").forEach(s=>s.remove());
  th.insertAdjacentHTML("beforeend", `<span class="seta"> ${ORDEM.asc?"▲":"▼"}</span>`);
  desenhar();
}));
carregar();
</script>
{% endblock %}
