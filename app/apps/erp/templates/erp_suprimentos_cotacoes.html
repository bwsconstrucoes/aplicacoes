{% extends "erp_base.html" %}
{% block titulo %}Cotações — ERP BWS{% endblock %}

{% block filtros %}
  <div class="filtros-cab"><h2>Cotações</h2>
    <button class="link-btn" id="btn-limpar">Limpar</button></div>
  <div class="busca"><span class="lupa">⌕</span>
    <input id="f-busca" type="search" placeholder="número ou título da cotação…"></div>

  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Situação</span>
      <span class="filtro-badge" id="badge-status">0</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div class="filtro-opcoes" id="opcoes-status"></div></div>
  </div>

  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Escolha o mapa</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div id="lista-cotacoes"></div></div>
  </div>
{% endblock %}

{% block conteudo %}
<h2>Mapa de cotação <small>fornecedores em coluna, insumos em linha, preço na célula</small></h2>
<div id="mensagem"></div>

<div class="tabela-barra" style="background:var(--branco); border-radius:var(--raio);
     box-shadow:var(--sombra); margin-bottom:14px">
  <span class="resumo" id="resumo-cotacao">nenhum mapa aberto</span>
  <span class="espaco"></span>
  <button class="btn" id="btn-nova-cot">Nova cotação</button>
</div>

<div id="painel-mapa"></div>

<dialog id="dlg">
  <div class="dlg-topo"><h3 id="dlg-titulo">—</h3>
    <button class="topo-btn" style="margin-left:auto" onclick="els('dlg').close()">Fechar</button></div>
  <div class="dlg-corpo" id="dlg-corpo"></div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let COTACOES = [], MAPA = null, BASE = {fornecedores: [], condicoes: []};

const STATUS = new Set();

document.querySelectorAll(".filtro-cab").forEach(b =>
  b.addEventListener("click", () => b.closest(".filtro").classList.toggle("aberto")));

async function carregarListas(){
  const [cots, cadastros] = await Promise.all([
    api("/erp/api/suprimentos/cotacoes"), api("/erp/api/suprimentos/cadastros")]);
  COTACOES = cots.cotacoes;
  BASE.condicoes = cadastros.condicoes;
  desenharLista();
}

// A escolha do mapa vive na barra da esquerda, como o filtro de qualquer
// outra tela do ERP — e não numa caixinha de cem cotações no topo.
function desenharLista(){
  const contagem = {};
  COTACOES.forEach(c => contagem[c.status] = (contagem[c.status] || 0) + 1);
  els("opcoes-status").innerHTML = Object.keys(contagem).sort().map(s => `
    <label class="opcao"><input type="checkbox" data-status="${s}"
      ${STATUS.has(s) ? "checked" : ""}>
      <span class="rotulo">${rotulo(s)}</span>
      <span class="qtd">${contagem[s]}</span></label>`).join("")
    || `<div class="cartao-dica">nenhuma cotação ainda</div>`;
  els("badge-status").textContent = STATUS.size;
  document.querySelectorAll("[data-status]").forEach(i =>
    i.addEventListener("change", ev => {
      const s = ev.target.dataset.status;
      ev.target.checked ? STATUS.add(s) : STATUS.delete(s);
      desenharLista();
    }));

  const q = (els("f-busca").value || "").toLowerCase().trim();
  const lista = COTACOES.filter(c =>
    (!STATUS.size || STATUS.has(c.status)) &&
    (!q || `${c.numero} ${c.titulo}`.toLowerCase().includes(q)));
  els("lista-cotacoes").innerHTML = lista.map(c => `
    <button class="btn secundario" data-cotacao="${c.id}"
      style="display:block; width:100%; text-align:left; margin-bottom:4px;
             ${MAPA && MAPA.id === c.id ? "border-color:var(--azul)" : ""}">
      <b>${c.numero}</b><br><small>${c.titulo}</small>
      ${c.status !== "ABERTA" ? `<br><span class="selo outro">${rotulo(c.status)}</span>` : ""}
    </button>`).join("")
    || `<div class="cartao-dica">nada com esses filtros</div>`;
  document.querySelectorAll("[data-cotacao]").forEach(b =>
    b.addEventListener("click", () => abrirMapa(+b.dataset.cotacao)));
}

function moeda(v){ return Number(v || 0).toLocaleString("pt-BR",
  {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function desenharMapa(){
  if (!MAPA) { els("painel-mapa").innerHTML = ""; return; }
  const colunas = MAPA.fornecedores;
  if (!colunas.length) {
    els("painel-mapa").innerHTML = `<div class="cartao">
      <div class="cartao-cab"><h3>${MAPA.numero} · ${MAPA.titulo}</h3></div>
      <div class="cartao-dica">Nenhum fornecedor no mapa ainda.</div>
      <div style="margin-top:10px"><button class="btn" id="btn-add-forn">Acrescentar fornecedor</button></div>
    </div>`;
    els("btn-add-forn").addEventListener("click", abrirFornecedor);
    return;
  }

  const cab = colunas.map(c => `<th style="min-width:150px">
      ${c.fornecedor}
      <br><button class="btn secundario" data-proposta="${c.id}"
          style="padding:3px 8px; font-size:11px">ler proposta</button>
      <br><small>${c.condicao || "sem condição"} ·
        ${c.entrega ? (c.entrega === "COLETA" ? "coleta" : "entrega") : "—"}</small>
      ${Number(c.frete) > 0 ? `<br><small>frete R$ ${moeda(c.frete)}</small>` : ""}
      ${Number(c.desconto) > 0 ? `<br><small>desc. R$ ${moeda(c.desconto)}</small>` : ""}
      <br><small>${c.itens_cotados}/${c.itens_no_mapa} itens</small></th>`).join("");

  const linhas = MAPA.itens.map(i => `<tr>
      <td>${i.insumo}${i.especificacao ? `<br><small>${i.especificacao}</small>` : ""}</td>
      <td class="direita dados">${i.quantidade} ${i.unidade}</td>
      ${colunas.map(c => {
        const cel = i.precos[c.id];
        if (!cel) return `<td class="direita"><input class="cel" data-col="${c.id}"
            data-lin="${i.id}" style="width:90px; text-align:right" placeholder="—"></td>`;
        const melhor = i.menor_preco_de === c.id;
        return `<td class="direita ${melhor ? "menor-preco" : ""}">
          <input class="cel" data-col="${c.id}" data-lin="${i.id}"
                 value="${cel.preco_unitario}" style="width:90px; text-align:right">
          <br><small>${moeda(cel.total)}</small>
          ${cel.origem === "HERDADO" ? `<br><small title="preço de outra cotação"
             style="color:var(--ambar)">herdado</small>` : ""}
          ${cel.origem === "IA" ? `<br><small style="color:var(--ciano)">lido</small>` : ""}
        </td>`;
      }).join("")}
    </tr>`).join("");

  const totais = colunas.map(c => `<td class="direita dados"><b>${moeda(c.total)}</b>
      ${c.itens_cotados < c.itens_no_mapa
        ? `<br><small>não cotou tudo</small>`
        : (MAPA.melhor_fornecedor_unico === c.id
            ? `<br><small style="color:var(--verde)">melhor no total</small>` : "")}</td>`).join("");

  els("painel-mapa").innerHTML = `<div class="cartao">
    <div class="cartao-cab"><h3>${MAPA.numero} · ${MAPA.titulo}</h3>
      <small>o total já inclui frete, desconto e acréscimo — comparar só o
        preço unitário engana</small></div>
    <div style="overflow-x:auto">
      <table><thead><tr><th>Insumo</th><th class="direita">Qtd</th>${cab}</tr></thead>
        <tbody>${linhas}</tbody>
        <tfoot><tr><td colspan="2"><b>Total</b></td>${totais}</tr>
          <tr><td colspan="2"><small>comprando cada item de quem tem o menor preço</small></td>
            <td colspan="${colunas.length}" class="direita dados">
              ${moeda(MAPA.total_pulverizado)} <small>(sem frete)</small></td></tr>
        </tfoot></table>
    </div>
    <div style="margin-top:12px; display:flex; gap:8px">
      <button class="btn" id="btn-salvar-precos">Salvar preços</button>
      <button class="btn secundario" id="btn-add-forn">Acrescentar fornecedor</button>
      <button class="btn secundario" id="btn-herdar">Puxar preços anteriores</button>
    </div>
    <div class="cartao-dica" style="margin-top:8px">A célula em verde é o menor
      preço da linha. "Herdado" quer dizer que o preço veio de outra cotação —
      confira a data antes de fechar com ele.</div>
  </div>`;

  els("btn-salvar-precos").addEventListener("click", salvarPrecos);
  els("btn-add-forn").addEventListener("click", abrirFornecedor);
  els("btn-herdar").addEventListener("click", herdarPrecos);
  document.querySelectorAll("[data-proposta]").forEach(b =>
    b.addEventListener("click", () => lerProposta(+b.dataset.proposta)));
}

// A proposta chega como PDF, foto do WhatsApp ou texto colado. A IA casa o que
// veio com os itens QUE JÁ ESTÃO NO MAPA — problema bem mais fácil do que
// adivinhar material do zero. O que ela não casar volta escrito na tela.
async function lerProposta(colunaId){
  const r = await perguntar({
    titulo: "Ler proposta do fornecedor",
    aviso: "Anexe o PDF/foto ou cole o texto. A IA preenche a coluna para você " +
           "conferir — nada é gravado sem você mandar salvar. O arquivo fica " +
           "guardado no mapa como prova.",
    campos: [{nome: "texto", rotulo: "Cole o texto da proposta", tipo: "textarea",
              linhas: 8, exemplo: "Vergalhão CA50 12.5mm — 100 M — R$ 38,50/un"}],
    textoOk: "Ler"});
  if (!r || !r.texto.trim()) return;
  aviso("mensagem", "Lendo a proposta…", "info");
  try {
    const d = await api(`/erp/api/suprimentos/cotacoes/fornecedores/${colunaId}/proposta`,
      {method: "POST", headers: {"Content-Type": "application/json"},
       body: JSON.stringify({texto: r.texto})});
    aplicarProposta(colunaId, d.leitura);
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

function aplicarProposta(colunaId, leitura){
  leitura.sugestoes.forEach(sug => {
    const campo = document.querySelector(
      `.cel[data-col="${colunaId}"][data-lin="${sug.cotacao_item_id}"]`);
    if (campo) {
      campo.value = sug.preco;
      campo.style.outline = sug.confianca === "ALTA"
        ? "2px solid var(--verde)" : "2px solid var(--ambar)";
      campo.title = `lido da proposta: ${sug.descricao_lida}` +
        (sug.confianca === "MEDIA" ? " — confira, a correspondência não é exata" : "");
    }
  });
  const partes = [leitura.resumo];
  if (leitura.nao_casados.length)
    partes.push("Não casou com o mapa: " +
      leitura.nao_casados.map(x => x.descricao).join(" · "));
  if (leitura.condicoes_lidas)
    partes.push("Condições lidas: " + leitura.condicoes_lidas);
  partes.push("Confira e clique em Salvar preços.");
  aviso("mensagem", partes.join(" "),
        leitura.nao_casados.length ? "alerta" : "ok");
}

async function abrirMapa(id){
  if (!id) { MAPA = null; desenharMapa(); desenharLista(); return; }
  try {
    const d = await api(`/erp/api/suprimentos/cotacoes/${id}/mapa`);
    MAPA = d.mapa;
    els("resumo-cotacao").innerHTML =
      `<b>${MAPA.numero}</b> · ${MAPA.titulo} · ${MAPA.fornecedores.length} fornecedor(es)`;
    desenharMapa();
    desenharLista();                 // realça na barra qual mapa está aberto
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

async function salvarPrecos(){
  const precos = [...document.querySelectorAll(".cel")]
    .filter(i => i.value.trim())
    .map(i => ({cotacao_fornecedor_id: +i.dataset.col, cotacao_item_id: +i.dataset.lin,
                preco: i.value.trim()}));
  if (!precos.length) { aviso("mensagem", "Nada para salvar.", "erro"); return; }
  try {
    const d = await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/precos`,
      {method: "POST", headers: {"Content-Type": "application/json"},
       body: JSON.stringify({precos})});
    aviso("mensagem", `${d.gravados} preço(s) salvos.` +
      (d.recusados.length ? ` ${d.recusados.length} recusado(s): ${
        d.recusados.map(r => r.motivo).join(" · ")}` : ""),
      d.recusados.length ? "alerta" : "ok");
    abrirMapa(MAPA.id);
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

async function abrirFornecedor(){
  const cadastros = await api("/erp/api/suprimentos/cadastros");
  const r = await perguntar({
    titulo: "Acrescentar fornecedor ao mapa",
    aviso: "Forma de pagamento, frete e desconto entram no total — é o que " +
           "permite comparar o custo real, e não só o preço unitário.",
    campos: [
      {nome: "fornecedor_id", rotulo: "Fornecedor", tipo: "select", obrigatorio: true,
       opcoes: (cadastros.fornecedores || []).map(f => ({valor: String(f.id), rotulo: f.nome}))},
      {nome: "condicao_pagamento_id", rotulo: "Condição de pagamento", tipo: "select",
       opcoes: [{valor: "", rotulo: "—"}].concat(
         BASE.condicoes.map(c => ({valor: String(c.id), rotulo: c.nome})))},
      {nome: "entrega", rotulo: "Entrega", tipo: "select",
       opcoes: [{valor: "", rotulo: "—"}, {valor: "ENTREGA", rotulo: "Fornecedor entrega"},
                {valor: "COLETA", rotulo: "Nós coletamos"}]},
      {nome: "frete", rotulo: "Frete (R$)", largura: 1},
      {nome: "desconto", rotulo: "Desconto (R$)", largura: 1},
      {nome: "respondido_por", rotulo: "Quem respondeu", largura: 1},
    ], textoOk: "Acrescentar"});
  if (!r) return;
  try {
    await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/fornecedores`,
      {method: "POST", headers: {"Content-Type": "application/json"},
       body: JSON.stringify(r)});
    abrirMapa(MAPA.id);
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

// Puxa, para cada linha vazia, o último preço conhecido daquele insumo. O que
// entra assim fica marcado como HERDADO no mapa — com a cotação de origem.
async function herdarPrecos(){
  const coluna = MAPA.fornecedores[0];
  if (!coluna) return;
  const precos = [];
  for (const linha of MAPA.itens) {
    if (linha.precos[coluna.id]) continue;
    if (!linha.insumo_id) continue;
    const d = await api(`/erp/api/suprimentos/precos?insumo_id=${
      linha.insumo_id}&dias=365`).catch(() => null);
    const r = d?.historico?.registros?.[0];
    if (r) precos.push({cotacao_fornecedor_id: coluna.id, cotacao_item_id: linha.id,
                        preco: r.preco_unitario, origem: "HERDADO",
                        herdado_de: r.cotacao_id,
                        observacao: `preço de ${r.data}`});
  }
  if (!precos.length) { aviso("mensagem", "Não há preço anterior para estes itens.", "alerta"); return; }
  await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/precos`,
    {method: "POST", headers: {"Content-Type": "application/json"},
     body: JSON.stringify({precos})});
  aviso("mensagem", `${precos.length} preço(s) herdados — confira a data antes de fechar.`, "alerta");
  abrirMapa(MAPA.id);
}

async function novaCotacao(){
  const d = await api("/erp/api/suprimentos/solicitacoes?status=SOLICITACAO");
  if (!d.itens.length) { aviso("mensagem", "Não há itens aguardando cotação.", "alerta"); return; }
  els("dlg-titulo").textContent = "Nova cotação";
  els("dlg-corpo").innerHTML = `<div id="dlg-msg"></div>
    <div class="campo"><label>Título da cotação *</label>
      <input id="nc-titulo" placeholder="ex.: armadura da fundação — setembro">
      <div class="dica">É por ele que você acha esta cotação depois.</div></div>
    <div class="campo" style="margin-top:10px"><label>Itens a cotar</label>
      <div class="filtro-opcoes" style="max-height:280px; border:1px solid var(--borda);
           border-radius:8px; padding:6px">
        ${d.itens.map(i => `<label class="opcao"><input type="checkbox" class="nc-item"
          value="${i.id}"><span class="rotulo">${i.solicitacao} · ${i.insumo}
          ${i.especificacao ? `(${i.especificacao})` : ""} — ${i.quantidade} ${i.unidade}
          · ${i.obra}</span></label>`).join("")}
      </div></div>
    <div style="margin-top:14px"><button class="btn" id="nc-salvar">Abrir cotação</button></div>`;
  els("nc-salvar").addEventListener("click", async () => {
    const itens = [...document.querySelectorAll(".nc-item:checked")].map(i => +i.value);
    try {
      const r = await api("/erp/api/suprimentos/cotacoes", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({titulo: els("nc-titulo").value, itens})});
      els("dlg").close();
      aviso("mensagem", `Cotação ${r.numero} aberta.`, "ok");
      await carregarListas();
      abrirMapa(r.id);
    } catch(e){ aviso("dlg-msg", e.message, "erro"); }
  });
  els("dlg").showModal();
}

els("btn-nova-cot").addEventListener("click", () => novaCotacao().catch(
  e => aviso("mensagem", e.message, "erro")));
els("f-busca").addEventListener("input", desenharLista);
els("btn-limpar").addEventListener("click", () => {
  STATUS.clear(); els("f-busca").value = ""; desenharLista();
});

carregarListas().then(() => {
  // A cotação nasce na tela de Solicitações e manda para cá pelo endereço:
  // quem acabou de gerar o mapa quer VER o mapa, não procurá-lo numa lista.
  const pedida = new URLSearchParams(location.search).get("cotacao");
  if (pedida) abrirMapa(+pedida);
}).catch(e => aviso("mensagem", e.message, "erro"));
</script>
{% endblock %}
