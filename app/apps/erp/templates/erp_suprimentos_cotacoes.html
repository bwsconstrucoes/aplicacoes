{% extends "erp_base.html" %}
{% block titulo %}Cotações — ERP BWS{% endblock %}

{% block filtros %}
  <div class="filtros-cab"><h2>Cotações</h2>
    <button class="link-btn" id="btn-limpar">Limpar</button></div>
  <div class="busca"><span class="lupa">⌕</span>
    <input id="f-busca" type="search" placeholder="número ou título da cotação…"></div>

  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Situação</span>
      <span class="filtro-badge" id="badge-status">0</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div class="filtro-opcoes" id="opcoes-status"></div></div>
  </div>

  <div class="filtro aberto">
    <button class="filtro-cab" type="button"><span>Escolha o mapa</span><span class="seta">▾</span></button>
    <div class="filtro-cont"><div id="lista-cotacoes"></div></div>
  </div>
{% endblock %}

{% block conteudo %}
<h2>Mapa de cotação <small>fornecedores em coluna, insumos em linha, preço na célula</small></h2>
<div id="mensagem"></div>

<div class="tabela-barra" style="background:var(--branco); border-radius:var(--raio);
     box-shadow:var(--sombra); margin-bottom:14px">
  <span class="resumo" id="resumo-cotacao">nenhum mapa aberto</span>
  <span class="espaco"></span>
  <button class="btn" id="btn-nova-cot">Nova cotação</button>
</div>

<div id="painel-mapa"></div>

<dialog id="dlg" class="largo">
  <div class="dlg-topo"><h3 id="dlg-titulo">—</h3>
    <button class="topo-btn" style="margin-left:auto" onclick="els('dlg').close()">Fechar</button></div>
  <div class="dlg-corpo" id="dlg-corpo"></div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let COTACOES = [], MAPA = null,
    BASE = {fornecedores: [], condicoes: [], insumos: [], unidades: [], obras: []};

const STATUS = new Set();

document.querySelectorAll(".filtro-cab").forEach(b =>
  b.addEventListener("click", () => b.closest(".filtro").classList.toggle("aberto")));

async function carregarListas(){
  const [cots, cadastros] = await Promise.all([
    api("/erp/api/suprimentos/cotacoes"), api("/erp/api/suprimentos/cadastros")]);
  COTACOES = cots.cotacoes;
  BASE.condicoes = cadastros.condicoes;
  // Insumos, unidades e obras vêm junto porque a correção do item acontece
  // AQUI: é olhando o mapa que o comprador descobre o pedido errado.
  BASE.insumos = cadastros.insumos || [];
  BASE.unidades = cadastros.unidades || [];
  BASE.obras = cadastros.obras || [];
  desenharLista();
}

// A escolha do mapa vive na barra da esquerda, como o filtro de qualquer
// outra tela do ERP — e não numa caixinha de cem cotações no topo.
function desenharLista(){
  const contagem = {};
  COTACOES.forEach(c => contagem[c.status] = (contagem[c.status] || 0) + 1);
  els("opcoes-status").innerHTML = Object.keys(contagem).sort().map(s => `
    <label class="opcao"><input type="checkbox" data-status="${s}"
      ${STATUS.has(s) ? "checked" : ""}>
      <span class="rotulo">${rotulo(s)}</span>
      <span class="qtd">${contagem[s]}</span></label>`).join("")
    || `<div class="cartao-dica">nenhuma cotação ainda</div>`;
  els("badge-status").textContent = STATUS.size;
  document.querySelectorAll("[data-status]").forEach(i =>
    i.addEventListener("change", ev => {
      const s = ev.target.dataset.status;
      ev.target.checked ? STATUS.add(s) : STATUS.delete(s);
      desenharLista();
    }));

  const q = (els("f-busca").value || "").toLowerCase().trim();
  const lista = COTACOES.filter(c =>
    (!STATUS.size || STATUS.has(c.status)) &&
    (!q || `${c.numero} ${c.titulo}`.toLowerCase().includes(q)));
  els("lista-cotacoes").innerHTML = lista.map(c => `
    <button class="btn secundario" data-cotacao="${c.id}"
      style="display:block; width:100%; text-align:left; margin-bottom:4px;
             ${MAPA && MAPA.id === c.id ? "border-color:var(--azul)" : ""}">
      <b>${c.numero}</b><br><small>${c.titulo}</small>
      ${c.status !== "ABERTA" ? `<br><span class="selo outro">${rotulo(c.status)}</span>` : ""}
    </button>`).join("")
    || `<div class="cartao-dica">nada com esses filtros</div>`;
  document.querySelectorAll("[data-cotacao]").forEach(b =>
    b.addEventListener("click", () => abrirMapa(+b.dataset.cotacao)));
}

function desenharMapa(){
  if (!MAPA) { els("painel-mapa").innerHTML = ""; return; }
  const colunas = MAPA.fornecedores;
  if (!colunas.length) {
    els("painel-mapa").innerHTML = `<div class="cartao">
      <div class="cartao-cab"><h3>${MAPA.numero} · ${MAPA.titulo}</h3></div>
      <div class="cartao-dica">Nenhum fornecedor no mapa ainda.</div>
      <div style="margin-top:10px"><button class="btn" id="btn-add-forn">Acrescentar fornecedor</button></div>
    </div>`;
    els("btn-add-forn").addEventListener("click", abrirFornecedor);
    return;
  }

  // ⚑ O MAPA NO FORMATO DA PLANILHA (20/11/2026). Ele mandou o relatório do
  // mapa 9228 — "é meio que um print da tela da planilha que a gente trabalha;
  // é uma planilha que a gente consegue visualizar bastante informação" — e
  // pediu "uma visão mais ampla, para conseguir colocar mais informações na
  // tela". O que a planilha tem e o mapa não tinha:
  //   · o cabeçalho de cada fornecedor em LINHAS (pagamento, entrega, frete,
  //     desconto, total geral), e não espremido em uma célula;
  //   · preço unitário E subtotal lado a lado, por fornecedor;
  //   · o número da solicitação e o número do item em cada linha;
  //   · no rodapé, melhor fornecedor e melhor compra, sem e com frete.
  // As colunas da esquerda ficam presas na rolagem: com seis fornecedores, é
  // o que mantém o nome do material à vista enquanto se digita o preço.
  const FIXAS = 7;
  const linhaCab = (rotulo, celula, classe = "") => `<tr class="cab-forn ${classe}">
      <th colspan="${FIXAS}" class="rot">${rotulo}</th>
      ${colunas.map(c => `<th colspan="2">${celula(c)}</th>`).join("")}</tr>`;
  const cab =
    linhaCab("Fornecedor", c => `<div class="nome-forn" title="${escapar(c.fornecedor)}">${escapar(c.fornecedor)}</div>
        <span class="sub">${c.itens_cotados}/${c.itens_no_mapa} itens · ${situacaoDoEnvio(c.id)}</span>
        <button class="link-btn" data-proposta="${c.id}" style="font-size:10.5px">ler proposta</button>`) +
    linhaCab("Pagamento", c => escapar(c.condicao || "—")) +
    linhaCab("Entrega", c => c.entrega ? (c.entrega === "COLETA" ? "Coleta (FOB)" : "Frete CIF") : "—") +
    linhaCab("Frete · Desconto", c => `${Number(c.frete) > 0 ? numero(c.frete) : "—"} · ${
        Number(c.desconto) > 0 ? numero(c.desconto) : "—"}${
        Number(c.acrescimo_percentual) ? ` · ${numero(c.acrescimo_percentual)}%` : ""}`) +
    linhaCab("Total geral", c => `<b>${numero(c.total)}</b>${
        c.itens_cotados < c.itens_no_mapa ? ` <span class="sub">não cotou tudo</span>`
        : (MAPA.melhor_fornecedor_unico === c.id
            ? ` <span class="sub" style="color:var(--verde); font-weight:700">melhor no total</span>` : "")}`,
      "total");

  // Uma linha por item, com a SITUAÇÃO ao lado do insumo: quem abre um mapa de
  // duas semanas atrás vê na hora o que já virou pedido, o que já chegou e o
  // que ainda está em cotação, sem sair da tela.
  const linhas = MAPA.itens.map((i, n) => `<tr>
      <td class="dados fixa" style="font-size:10.5px">${escapar(i.solicitacao || "")}</td>
      <td class="dados fixa direita">${n + 1}</td>
      <td class="insumo fixa"><b>${escapar(i.insumo)}</b>
        ${i.corrigivel ? `<button class="lapis" data-corrigir="${i.suprimento_item_id}"
          title="Corrigir o que a obra pediu — exige motivo e fica registrado"
          aria-label="corrigir">✎</button>` : ""}
        ${i.especificacao ? `<small>${escapar(i.especificacao)}</small>` : ""}
        ${i.correcoes ? `<small class="corrigido">corrigido ${i.correcoes}×</small>` : ""}</td>
      <td>${selo(i.status, i.status_rotulo)}</td>
      <td class="dados" style="font-size:11px">${escapar(i.obra || "—")}</td>
      <td class="direita dados" style="white-space:nowrap">${quantidadeBR(i.quantidade)}</td>
      <td class="dados"><small>${escapar(i.unidade)}</small></td>
      ${colunas.map(c => {
        const cel = i.precos[c.id];
        if (!cel) return `<td class="direita sem-preco"><input class="cel" data-col="${c.id}"
            data-lin="${i.id}" placeholder="—"></td><td class="direita dados subtotal">—</td>`;
        const melhor = i.menor_preco_de === c.id;
        return `<td class="direita ${melhor ? "menor-preco" : ""}">
          <input class="cel" data-col="${c.id}" data-lin="${i.id}"
                 value="${Number(cel.preco_unitario).toLocaleString("pt-BR",
                   {minimumFractionDigits: 2, maximumFractionDigits: 4})}"${
            cel.origem === "HERDADO" ? ` title="preço herdado de outra cotação" style="color:var(--ambar)"` : ""}${
            cel.origem === "IA" ? ` title="lido da proposta" style="color:var(--ciano)"` : ""}></td>
          <td class="direita dados subtotal ${melhor ? "menor-preco" : ""}">${numero(cel.total)}</td>`;
      }).join("")}
    </tr>`).join("");

  // Quantos itens em cada situação — o resumo que a planilha dá pela cor.
  const porSituacao = {};
  MAPA.itens.forEach(i => {
    if (!i.status) return;
    porSituacao[i.status] = porSituacao[i.status] || {n: 0, rotulo: i.status_rotulo};
    porSituacao[i.status].n++;
  });
  const resumoSituacoes = Object.entries(porSituacao)
    .map(([chave, x]) => `${selo(chave, `${x.rotulo}: ${x.n}`)}`).join(" ");

  // O RODAPÉ DA PLANILHA: as quatro contas que decidem a compra.
  const porId = Object.fromEntries(colunas.map(c => [c.id, c]));
  const vencedores = new Set(MAPA.itens.map(i => i.menor_preco_de).filter(Boolean));
  const encargos = [...vencedores].reduce((s, id) =>
    s + Number(porId[id].frete || 0) - Number(porId[id].desconto || 0), 0);
  const unico = porId[MAPA.melhor_fornecedor_unico];
  const semCotacao = MAPA.itens.filter(i => !i.menor_preco_de).length;
  const rodape = `<div class="rodape-mapa">
      <div><span>Melhor fornecedor (sem frete)</span><b>${unico ? numero(unico.soma_itens) : "—"}</b>
        <small>${unico ? escapar(unico.fornecedor) : "ninguém cotou todos os itens"}</small></div>
      <div><span>Melhor fornecedor (com frete)</span><b>${unico ? numero(unico.total) : "—"}</b>
        <small>comprando tudo de um só</small></div>
      <div><span>Melhor compra (sem frete)</span><b>${numero(MAPA.total_pulverizado)}</b>
        <small>cada item de quem tem o menor preço · ${vencedores.size} fornecedor(es)</small></div>
      <div><span>Melhor compra (com frete)</span><b>${numero(Number(MAPA.total_pulverizado) + encargos)}</b>
        <small>somando o frete de cada fornecedor envolvido</small></div>
      ${semCotacao ? `<div class="alerta"><span>Sem preço de ninguém</span><b>${semCotacao}</b>
        <small>item(ns) fora das contas acima</small></div>` : ""}
    </div>`;

  els("painel-mapa").innerHTML = `<div class="cartao" id="cartao-mapa">
    <div class="cartao-cab"><h3>${escapar(MAPA.numero)} · ${escapar(MAPA.titulo)}</h3>
      <small>${MAPA.itens.length} item(ns) · ${colunas.length} fornecedor(es) ·
        o total geral já inclui frete, desconto e acréscimo</small>
      <button class="btn secundario" id="btn-cheio" style="margin-left:auto"
        title="Abrir o mapa na tela inteira, para trabalhar com muitos itens e fornecedores"
        >⛶ Tela cheia</button></div>
    <div class="solta-proposta" id="solta-proposta">
      <b>Jogue aqui a proposta do fornecedor</b> (PDF, foto ou XML) — ou
      <label class="link-btn" style="cursor:pointer">escolha o arquivo
        <input type="file" id="arq-proposta" hidden multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xml"></label>.
      <small>O sistema lê, descobre de qual fornecedor é e preenche a coluna dele
        para você conferir. Nada é gravado antes de "Salvar preços".</small></div>
    ${resumoSituacoes ? `<div style="margin:0 0 8px; display:flex; gap:4px;
      flex-wrap:wrap">${resumoSituacoes}</div>` : ""}
    <div class="rolagem-mapa">
      <table class="mapa planilha"><thead>${cab}
        <tr class="cab-itens"><th class="fixa">Nº SS</th><th class="fixa">#</th>
          <th class="fixa">Descrição</th><th>Situação</th><th>Obra</th>
          <th class="direita">Qtd</th><th>Und</th>
          ${colunas.map(() => `<th class="direita">Preço unit.</th><th class="direita">Subtotal</th>`).join("")}
        </tr></thead>
        <tbody>${linhas}</tbody></table>
    </div>
    ${rodape}
    <div class="barra-mapa">
      <button class="btn" id="btn-salvar-precos">Salvar preços</button>
      <button class="btn secundario" id="btn-add-forn">Acrescentar fornecedor</button>
      <button class="btn secundario" id="btn-herdar">Puxar preços anteriores</button>
      <button class="btn secundario" id="btn-relatorios">📊 Relatórios do mapa</button>
      <button class="btn secundario" id="btn-mapa-pdf"
        title="O mapa no formato da planilha, com as condições de cada fornecedor e os quatro resumos — para a gestão analisar"
        >&#10515; Mapa em PDF</button>
      <span class="espaco" style="flex:1"></span>
      <button class="btn secundario" id="btn-disparar">✉ Disparar a cotação</button>
      {% if pode.comprar %}<button class="btn" id="btn-fechar-pedido"
        title="Escolher o fornecedor e os itens, e mandar o pedido para autorização"
        >✔ Fechar pedido</button>{% endif %}
    </div>
    <div class="cartao-dica" style="margin-top:8px">A célula em verde é o menor
      preço da linha. Preço em âmbar veio de outra cotação (herdado); em azul,
      foi lido de uma proposta — confira antes de fechar com ele.</div>
  </div>`;

  if (CHEIO) els("cartao-mapa").classList.add("cheio");
  els("btn-cheio").textContent = CHEIO ? "✕ Sair da tela cheia" : "⛶ Tela cheia";
  els("btn-cheio").addEventListener("click", () => { CHEIO = !CHEIO;
    document.body.classList.toggle("com-mapa-cheio", CHEIO); desenharMapa(); });
  const zona = els("solta-proposta");
  ["dragenter", "dragover"].forEach(ev => zona.addEventListener(ev, e => {
    e.preventDefault(); zona.classList.add("sobre"); }));
  ["dragleave", "drop"].forEach(ev => zona.addEventListener(ev, e => {
    e.preventDefault(); zona.classList.remove("sobre"); }));
  zona.addEventListener("drop", e => jogarPropostas([...e.dataTransfer.files]));
  els("arq-proposta").addEventListener("change", e => jogarPropostas([...e.target.files]));

  els("btn-salvar-precos").addEventListener("click", salvarPrecos);
  els("btn-add-forn").addEventListener("click", abrirFornecedor);
  els("btn-herdar").addEventListener("click", herdarPrecos);
  els("btn-relatorios").addEventListener("click", () => abrirRelatorios("POR_ITEM"));
  // ⚑ O PDF DO MAPA É FEITO NO SERVIDOR desde 20/11/2026, no formato da
  // planilha (condições de cada fornecedor, unitário e subtotal, resumos). A
  // exportação genérica que havia aqui trazia só o preço unitário.
  els("btn-mapa-pdf").addEventListener("click", () =>
    window.open(`/erp/suprimentos/cotacoes/${MAPA.id}/pdf`, "_blank", "noopener"));
  els("btn-disparar").addEventListener("click", abrirDisparo);
  if (els("btn-fechar-pedido"))
    els("btn-fechar-pedido").addEventListener("click", () => abrirFechamento());
  document.querySelectorAll("[data-proposta]").forEach(b =>
    b.addEventListener("click", () => lerProposta(+b.dataset.proposta)));
  document.querySelectorAll("[data-corrigir]").forEach(b =>
    b.addEventListener("click", () => corrigirItem(+b.dataset.corrigir)));
}

// ---------------------------------------------------------------------------
// Correção do item, sem sair do mapa
//
// A obra pede em saco o que só vem em bag, escreve o material errado, confunde
// um insumo com o vizinho — e é aqui, comparando preços, que o comprador
// percebe. Corrigir sem assinatura vira "eu não pedi isso": o MOTIVO é
// obrigatório e tudo fica gravado.
// ---------------------------------------------------------------------------
async function corrigirItem(itemId){
  const i = (MAPA.itens || []).find(x => x.suprimento_item_id === itemId);
  if (!i) return;
  const d = await perguntar({
    titulo: `Corrigir ${i.insumo}`,
    textoOk: "Corrigir e registrar",
    aviso: "Fica gravado o que era, o que passou a ser, quem mudou e quando. " +
           "Mudando o material ou a unidade, os preços já digitados nesta " +
           "linha são apagados — eram de outra coisa.",
    campos: [
      {nome: "insumo_id", rotulo: "Insumo", tipo: "select", largura: 3,
       valor: String(i.insumo_id),
       opcoes: BASE.insumos.map(x => ({valor: String(x.id), rotulo: x.descricao}))},
      {nome: "especificacao", rotulo: "Especificação", largura: 2,
       valor: i.especificacao || "", exemplo: "ex.: CP-II 50kg, cinza"},
      {nome: "quantidade", rotulo: "Quantidade", largura: 1,
       valor: quantidadeBR(i.quantidade)},
      {nome: "unidade", rotulo: "Unidade", tipo: "select", largura: 1,
       valor: i.unidade,
       opcoes: BASE.unidades.map(u => ({valor: u.codigo,
                                        rotulo: `${u.codigo} · ${u.descricao}`}))},
      {nome: "obra_id", rotulo: "Obra que recebe", tipo: "select", largura: 2,
       valor: String(i.obra_id),
       opcoes: BASE.obras.map(o => ({valor: String(o.id), rotulo: rotuloObra(o)}))},
      {nome: "motivo", rotulo: "Motivo da correção", tipo: "textarea", linhas: 2,
       obrigatorio: true, largura: 3,
       exemplo: "ex.: material solicitado errado — a obra queria CP-V"}]});
  if (!d) return;
  try {
    const r = await api(`/erp/api/suprimentos/itens/${itemId}`, {method: "PATCH",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(d)});
    aviso("mensagem", `${Object.keys(r.mudancas || {}).length} campo(s) corrigido(s).` +
      (r.avisos && r.avisos.length ? " " + r.avisos.join(" ") : ""),
      r.avisos && r.avisos.length ? "alerta" : "ok");
    abrirMapa(MAPA.id);
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

// ---------------------------------------------------------------------------
// OS QUATRO RELATÓRIOS DO MAPA
//
// São os mesmos das abas R2 a R5 da planilha que a equipe já usa. Cada um
// responde uma pergunta diferente, e é por isso que são quatro:
//
//   por item        "de quem compro cada coisa pelo menor preço?"
//   por fornecedor  "então o que compro de cada um?" — é a lista de compra
//   um fornecedor   "e se eu comprar tudo deste aqui?"
//   comparativo     "quem sai melhor no total, com frete e desconto?"
//
// Os quatro saem do mesmo mapa: não há como dois deles darem números
// diferentes para a mesma cotação.
// ---------------------------------------------------------------------------
const RELATORIOS = [
  ["POR_ITEM", "Por item"],
  ["POR_FORNECEDOR", "Por fornecedor"],
  ["UM_FORNECEDOR", "Comprando tudo de um"],
  ["COMPARATIVO", "Comparativo"],
];
let REL = null;          // o relatório aberto agora

async function abrirRelatorios(tipo, fornecedor){
  if (!MAPA) return;
  els("dlg-titulo").textContent = `Relatórios — ${MAPA.numero}`;
  els("dlg-corpo").innerHTML = `<div id="rel-msg"></div>
    <div class="subabas" id="rel-abas"></div>
    <div id="rel-corpo" class="cartao-dica">carregando…</div>`;
  els("dlg").showModal();
  desenharAbasDeRelatorio(tipo);
  await carregarRelatorio(tipo, fornecedor);
}

function desenharAbasDeRelatorio(ativo){
  els("rel-abas").innerHTML = RELATORIOS.map(([chave, rotulo]) =>
    `<button class="subaba ${chave === ativo ? "ativa" : ""}"
       data-rel="${chave}">${rotulo}</button>`).join("");
  document.querySelectorAll("[data-rel]").forEach(b =>
    b.addEventListener("click", () => abrirRelatorios(b.dataset.rel)));
}

async function carregarRelatorio(tipo, fornecedor){
  try {
    const url = `/erp/api/suprimentos/cotacoes/${MAPA.id}/relatorio?tipo=${tipo}`
      + (fornecedor ? `&fornecedor=${fornecedor}` : "");
    const d = await api(url);
    REL = d.relatorio;
    desenharRelatorio();
  } catch(e){ els("rel-corpo").innerHTML = ""; aviso("rel-msg", e.message, "erro"); }
}

function desenharRelatorio(){
  const r = REL;
  // No relatório de um fornecedor só, dá para trocar de fornecedor sem sair
  // da tela — é comparando "tudo do A" com "tudo do B" que se decide.
  const escolha = r.escolhas ? `
    <div class="campo" style="max-width:520px; margin-bottom:10px">
      <label>Comprando tudo de</label>
      <select id="rel-forn">${r.escolhas.map(e => `
        <option value="${e.id}" ${e.id === r.cotacao_fornecedor_id ? "selected" : ""}>
          ${escapar(e.fornecedor)} — ${e.itens_cotados}/${e.itens_no_mapa} itens ·
          R$ ${escapar(e.total)}</option>`).join("")}</select></div>` : "";

  const rodape = r.total !== undefined ? `
    <div class="kpis" style="margin-top:12px">
      ${r.soma_itens !== undefined ? `<div class="kpi estatico">
        <div class="kpi-rotulo">Soma dos itens</div>
        <div class="kpi-valor" style="font-size:17px">${escapar(r.soma_itens)}</div></div>` : ""}
      <div class="kpi estatico verde"><div class="kpi-rotulo">Total</div>
        <div class="kpi-valor" style="font-size:17px">${escapar(r.total_br || r.total)}</div></div>
      ${r.sem_preco ? `<div class="kpi estatico vermelho">
        <div class="kpi-rotulo">Sem preço nenhum</div>
        <div class="kpi-valor" style="font-size:17px">${r.sem_preco}</div>
        <div class="kpi-sub">ninguém cotou</div></div>` : ""}
      ${r.itens_sem_preco ? `<div class="kpi estatico ambar">
        <div class="kpi-rotulo">Este não cotou</div>
        <div class="kpi-valor" style="font-size:17px">${r.itens_sem_preco}</div>
        <div class="kpi-sub">item(ns) ficariam de fora</div></div>` : ""}
    </div>` : "";

  const resumo = r.resumo_por_fornecedor && r.resumo_por_fornecedor.length > 1 ? `
    <div class="cartao-dica" style="margin-top:10px"><b>A compra ficaria assim:</b>
      ${r.resumo_por_fornecedor.map(x =>
        `<br>${escapar(x.fornecedor)} — ${x.itens} item(ns) · R$ ${escapar(x.total)}`)
        .join("")}</div>` : "";

  els("rel-corpo").innerHTML = `
    ${escolha}
    <div class="aviso info">${escapar(r.aviso || "")}</div>
    <div class="tabela-rolagem" style="max-height:46vh; margin-top:10px">
      <table class="mapa"><thead><tr>${r.colunas.map(c =>
        `<th class="${c.tipo && c.tipo !== "texto" ? "direita" : ""}"
          >${escapar(c.rotulo)}</th>`).join("")}</tr></thead>
        <tbody>${r.linhas.map(l => `<tr>${l.map((v, i) =>
          `<td class="${r.colunas[i].tipo && r.colunas[i].tipo !== "texto"
            ? "direita dados" : ""}">${escapar(v)}</td>`).join("")}</tr>`).join("")}
        </tbody></table>
    </div>
    ${resumo}
    ${rodape}
    <div style="margin-top:12px; display:flex; gap:6px" id="rel-exportar"></div>`;

  if (r.escolhas) {
    els("rel-forn").addEventListener("change", ev =>
      abrirRelatorios("UM_FORNECEDOR", ev.target.value));
  }
  botoesDeExportar("rel-exportar", () => ({
    titulo: r.titulo, subtitulo: r.subtitulo, filtros: r.filtros,
    colunas: r.colunas, linhas: r.linhas,
  }));
}

// O MAPA INTEIRO EM PDF. Deitado quando há muitos fornecedores — em pé, as
// colunas ficam tão estreitas que não se lê nada. Foi o pedido do dono.
function exportarMapa(){
  if (!MAPA) return;
  const colunas = [{rotulo: "Insumo"}, {rotulo: "Situação"}, {rotulo: "Obra"},
                   {rotulo: "Qtd", tipo: "quantidade"}, {rotulo: "Un."}]
    .concat(MAPA.fornecedores.map(c => ({rotulo: c.fornecedor, tipo: "dinheiro"})));
  // Os números vão FORMATADOS: "14.000" no banco é catorze, e "38.5000" não
  // se lê em português. O papel é lido por gente.
  const linhas = MAPA.itens.map(i => [
    i.especificacao ? `${i.insumo} — ${i.especificacao}` : i.insumo,
    i.status_rotulo || "", i.obra || "", quantidadeBR(i.quantidade), i.unidade,
    ...MAPA.fornecedores.map(c => {
      const cel = i.precos[c.id];
      return cel ? numero(cel.preco_unitario) : "";
    })]);
  linhas.push(["TOTAL (com frete, desconto e acréscimo)", "", "", "", "",
               ...MAPA.fornecedores.map(c => numero(c.total))]);
  exportarTela({
    titulo: `Mapa de cotação ${MAPA.numero}`,
    subtitulo: MAPA.titulo,
    filtros: [`${MAPA.itens.length} item(ns) · ${MAPA.fornecedores.length} fornecedor(es)`,
              "A célula do menor preço está destacada na tela, não no papel."],
    colunas, linhas, formato: "pdf",
    paisagem: MAPA.fornecedores.length > 2,
  });
}

// ---------------------------------------------------------------------------
// Disparar a cotação
//
// O comprador precisa de duas certezas: que saiu, e para quem. Por isso o
// modal mostra o texto exato ANTES de mandar, e a coluna de cada fornecedor
// passa a dizer "enviada em tal dia" ou o motivo de não ter saído.
//
// O que o sistema NÃO promete está escrito na tela com todas as letras:
// registrar que o servidor aceitou não é o mesmo que o fornecedor ter lido.
// ---------------------------------------------------------------------------
let ENVIOS = {};          // coluna_id → último envio

function situacaoDoEnvio(colunaId){
  const e = ENVIOS[colunaId];
  if (!e) return `<small style="color:var(--tinta-suave)">não enviada</small>`;
  if (e.situacao === "ENVIADO")
    return `<small style="color:var(--verde)">enviada ${dataBR((e.quando||"").slice(0,10))}</small>`;
  return `<small style="color:var(--vermelho)" title="${(e.erro||"").replace(/"/g,"&quot;")}"
            >não saiu</small>`;
}

async function carregarEnvios(){
  ENVIOS = {};
  try {
    const d = await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/envios`);
    // o histórico vem do mais novo para o mais velho: o primeiro de cada
    // fornecedor é o último envio para ele
    d.envios.forEach(e => {
      if (e.destinatario_tipo !== "cotacao_fornecedor") return;
      if (!(e.destinatario_id in ENVIOS)) ENVIOS[e.destinatario_id] = e;
    });
  } catch(e){ /* sem histórico não impede o mapa de abrir */ }
}

// A proposta chega como PDF, foto do WhatsApp ou texto colado. A IA casa o que
// veio com os itens QUE JÁ ESTÃO NO MAPA — problema bem mais fácil do que
// adivinhar material do zero. O que ela não casar volta escrito na tela.
// ---------------------------------------------------------------------------
// JOGAR A PROPOSTA NO MAPA (20/11/2026)
//
// O dono: "eu estou num determinado mapa, eu jogo o arquivo, aí o sistema faz
// a leitura e tenta preencher o mapa, de forma a facilitar o trabalho do
// comprador. Isso é algo importante."
//
// Já existia "ler proposta" na coluna de cada fornecedor — mas pedia para
// escolher o fornecedor ANTES. Aqui o arquivo é jogado no mapa e o sistema
// descobre de quem é (pelo CNPJ da proposta, ou pelo nome). Vários arquivos de
// uma vez são lidos um a um. Quando não reconhece, PERGUNTA — preço na coluna
// errada é o erro mais caro desta tela.
// ---------------------------------------------------------------------------
let CHEIO = false;

async function jogarPropostas(arquivos){
  if (!arquivos.length || !MAPA) return;
  const relato = [];
  for (const arquivo of arquivos) {
    aviso("mensagem", `Lendo ${escapar(arquivo.name)}…`, "info");
    try {
      const forma = new FormData();
      forma.append("arquivo", arquivo);
      const d = await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/proposta`,
        {method: "POST", body: forma});
      const l = d.leitura;
      let coluna = l.coluna_id;
      if (!coluna) {
        const r = await perguntar({
          titulo: "De qual fornecedor é esta proposta?",
          aviso: `Li "${arquivo.name}"${l.emitente_lido ? ` (emitida por ${l.emitente_lido})` : ""}, `
            + `mas ${l.reconhecido}. ${l.sugestoes.length} preço(s) lidos. Escolha a coluna `
            + `— ou cancele, acrescente o fornecedor ao mapa e jogue o arquivo de novo.`,
          campos: [{nome: "coluna", rotulo: "Fornecedor", tipo: "select",
            opcoes: MAPA.fornecedores.map(f => ({valor: String(f.id), rotulo: f.fornecedor}))}],
          textoOk: "É deste"});
        if (!r || !r.coluna) { relato.push(`${arquivo.name}: não aplicada`); continue; }
        coluna = +r.coluna;
      }
      await aplicarProposta(coluna, l);
      const nome = (MAPA.fornecedores.find(f => f.id === coluna) || {}).fornecedor || "";
      relato.push(`<b>${escapar(nome)}</b>${l.coluna_id ? ` (reconhecido ${l.reconhecido})` : ""}: ${l.resumo}`
        + (l.nao_casados.length ? ` Não casou: ${l.nao_casados.map(x => escapar(x.descricao)).join(" · ")}.` : ""));
    } catch(e){ relato.push(`${escapar(arquivo.name)}: ${escapar(e.message)}`); }
  }
  aviso("mensagem", relato.join("<br>") + "<br>Confira os campos contornados e clique em <b>Salvar preços</b>.", "alerta");
}

// Recarrega o mapa SEM PERDER o que está digitado e ainda não foi salvo.
// ⚑ Defeito consertado em 20/11/2026: confirmar as condições lidas na
// proposta recarregava o mapa — e os preços que a IA tinha acabado de
// preencher, ainda não salvos, sumiam sem aviso.
async function recarregarMantendoDigitado(){
  const digitado = [...document.querySelectorAll(".cel")].map(i => ({
    col: i.dataset.col, lin: i.dataset.lin, valor: i.value,
    contorno: i.style.outline, dica: i.title}));
  await abrirMapa(MAPA.id);
  digitado.forEach(d => {
    const campo = document.querySelector(`.cel[data-col="${d.col}"][data-lin="${d.lin}"]`);
    if (campo && d.contorno) { campo.value = d.valor; campo.style.outline = d.contorno; campo.title = d.dica; }
  });
}

async function lerProposta(colunaId){
  // O ARQUIVO vem junto do texto colado, e não em outro botão: a resposta do
  // fornecedor chega em PDF, em foto do WhatsApp e em e-mail colado, e obrigar
  // a pessoa a escolher o caminho antes de saber qual tem em mãos é o que o
  // dono já mandou não fazer nos cadastros ("uma porta só").
  const r = await perguntar({
    titulo: "Ler proposta do fornecedor",
    aviso: "Jogue aqui o PDF ou a foto da proposta — ou cole o texto do e-mail. " +
           "A IA preenche os preços E as condições (pagamento, frete, CIF/FOB, " +
           "prazo) para você conferir. Nada é gravado sem você mandar salvar; " +
           "o arquivo fica guardado no mapa como prova.",
    campos: [
      {nome: "arquivo", rotulo: "Proposta (PDF, foto ou XML)", tipo: "arquivo"},
      {nome: "texto", rotulo: "…ou cole o texto da proposta", tipo: "textarea",
       linhas: 6, exemplo: "Vergalhão CA50 12.5mm — 100 M — R$ 38,50/un\n" +
                           "Pagamento 28 dias · frete incluso · validade 30/09"},
    ],
    textoOk: "Ler"});
  if (!r) return;
  const arquivo = (r.arquivo instanceof File) ? r.arquivo
                : (r.arquivo && r.arquivo[0]) || null;
  if (!arquivo && !(r.texto || "").trim())
    return aviso("mensagem", "Anexe a proposta ou cole o texto dela.", "erro");
  aviso("mensagem", "Lendo a proposta…", "info");
  try {
    let d;
    const url = `/erp/api/suprimentos/cotacoes/fornecedores/${colunaId}/proposta`;
    if (arquivo) {
      const forma = new FormData();
      forma.append("arquivo", arquivo);
      forma.append("texto", r.texto || "");
      d = await api(url, {method: "POST", body: forma});
    } else {
      d = await api(url, {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({texto: r.texto})});
    }
    aplicarProposta(colunaId, d.leitura);
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

async function aplicarProposta(colunaId, leitura){
  leitura.sugestoes.forEach(sug => {
    const campo = document.querySelector(
      `.cel[data-col="${colunaId}"][data-lin="${sug.cotacao_item_id}"]`);
    if (campo) {
      campo.value = sug.preco;
      campo.style.outline = sug.confianca === "ALTA"
        ? "2px solid var(--verde)" : "2px solid var(--ambar)";
      campo.title = `lido da proposta: ${sug.descricao_lida}` +
        (sug.confianca === "MEDIA" ? " — confira, a correspondência não é exata" : "");
    }
  });
  const partes = [leitura.resumo];
  if (leitura.nao_casados.length)
    partes.push("Não casou com o mapa: " +
      leitura.nao_casados.map(x => x.descricao).join(" · "));
  if (leitura.condicoes && leitura.condicoes.resumo)
    partes.push("Condições: " + leitura.condicoes.resumo);
  if (leitura.condicoes_lidas)
    partes.push("Observações: " + leitura.condicoes_lidas);
  partes.push("Confira e clique em Salvar preços.");
  aviso("mensagem", partes.join(" "),
        leitura.nao_casados.length ? "alerta" : "ok");
  if (leitura.condicoes) await confirmarCondicoes(colunaId, leitura.condicoes);
}

// AS CONDIÇÕES NÃO SE GRAVAM SOZINHAS, e o motivo é aritmético: frete e forma
// de pagamento entram no total do mapa. Uma leitura errada aqui não deixa um
// campo feio — troca o vencedor da cotação. Por isso vêm num formulário, já
// preenchidas, para a pessoa olhar e confirmar.
async function confirmarCondicoes(colunaId, c){
  if (!c.forma_pagamento_lida && c.frete === null && c.entrega === null
      && c.prazo_entrega_dias === null && !c.validade) return;
  const r = await perguntar({
    titulo: "Condições lidas na proposta",
    aviso: "Frete e forma de pagamento entram no total e podem trocar o "
         + "vencedor da cotação — por isso não gravo sozinho. Confira e "
         + "confirme, ou feche e lance à mão.",
    campos: [
      {nome: "condicao_pagamento_id", rotulo: "Condição de pagamento", tipo: "select",
       valor: c.condicao_pagamento_id ? String(c.condicao_pagamento_id) : "",
       opcoes: [{valor: "", rotulo: c.forma_pagamento_lida
                   ? `— (a proposta diz "${c.forma_pagamento_lida}")` : "—"}]
                .concat(BASE.condicoes.map(x => ({valor: String(x.id), rotulo: x.nome})))},
      {nome: "entrega", rotulo: "Frete por conta de quem", tipo: "select",
       valor: c.entrega || "",
       opcoes: [{valor: "", rotulo: "— não diz"},
                {valor: "ENTREGA", rotulo: "Fornecedor entrega (CIF)"},
                {valor: "COLETA", rotulo: "Nós retiramos (FOB)"}]},
      {nome: "frete", rotulo: "Valor do frete (R$)", largura: 1,
       valor: c.frete === null ? "" : c.frete},
      {nome: "desconto", rotulo: "Desconto (R$)", largura: 1,
       valor: c.desconto === null ? "" : c.desconto},
      {nome: "prazo_entrega_dias", rotulo: "Prazo de entrega (dias)", largura: 1,
       valor: c.prazo_entrega_dias === null ? "" : String(c.prazo_entrega_dias)},
      {nome: "validade_proposta", rotulo: "Preço vale até", tipo: "date",
       largura: 1, valor: c.validade || ""},
    ], textoOk: "Gravar as condições"});
  if (!r) return;
  try {
    const d = await api(
      `/erp/api/suprimentos/cotacoes/fornecedores/${colunaId}/condicoes`,
      {method: "POST", headers: {"Content-Type": "application/json"},
       body: JSON.stringify(r)});
    aviso("mensagem", d.recado, "ok");
    await recarregarMantendoDigitado();
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

async function abrirMapa(id){
  if (!id) { MAPA = null; desenharMapa(); desenharLista(); return; }
  try {
    const d = await api(`/erp/api/suprimentos/cotacoes/${id}/mapa`);
    MAPA = d.mapa;
    await carregarEnvios();
    els("resumo-cotacao").innerHTML =
      `<b>${MAPA.numero}</b> · ${MAPA.titulo} · ${MAPA.fornecedores.length} fornecedor(es)`;
    desenharMapa();
    desenharLista();                 // realça na barra qual mapa está aberto
  } catch(e){ aviso("mensagem", e.message, "erro"); }
}

async function salvarPrecos(){

                preco: i.value.trim()}));

      {method: "POST", headers: {"Content-Type": "application/json"},
       body: JSON.stringify({precos})});

      d.recusados.length ? "alerta" : "ok");

// Puxa, para cada linha vazia, o último preço conhecido daquele insumo. O que
// entra assim fica marcado como HERDADO no mapa — com a cotação de origem.
async function herdarPrecos(){
  const coluna = MAPA.fornecedores[0];
  if (!coluna) return;
  const precos = [];
  for (const linha of MAPA.itens) {
    if (linha.precos[coluna.id]) continue;
    if (!linha.insumo_id) continue;
    const d = await api(`/erp/api/suprimentos/precos?insumo_id=${
      linha.insumo_id}&dias=365`).catch(() => null);
    const r = d?.historico?.registros?.[0];
    if (r) precos.push({cotacao_fornecedor_id: coluna.id, cotacao_item_id: linha.id,
                        preco: r.preco_unitario, origem: "HERDADO",
                        herdado_de: r.cotacao_id,
                        observacao: `preço de ${r.data}`});
  }
  if (!precos.length) { aviso("mensagem", "Não há preço anterior para estes itens.", "alerta"); return; }
  await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/precos`,
    {method: "POST", headers: {"Content-Type": "application/json"},
     body: JSON.stringify({precos})});
  aviso("mensagem", `${precos.length} preço(s) herdados — confira a data antes de fechar.`, "alerta");
  abrirMapa(MAPA.id);
}

  if (!d.itens.length) { aviso("mensagem", "Não há itens aguardando cotação.", "alerta"); return; }

    <div class="campo"><label>Título da cotação *</label>
      <input id="nc-titulo" placeholder="ex.: armadura da fundação — setembro">
      <div class="dica">É por ele que você acha esta cotação depois.</div></div>
    <div class="campo" style="margin-top:10px"><label>Itens a cotar</label>
      <div class="filtro-opcoes" style="max-height:280px; border:1px solid var(--borda);
           border-radius:8px; padding:6px">
        ${d.itens.map(i => `<label class="opcao"><input type="checkbox" class="nc-item"
          value="${i.id}"><span class="rotulo">${i.solicitacao} · ${i.insumo}

    <div style="margin-top:14px"><button class="btn" id="nc-salvar">Abrir cotação</button></div>`;
  els("nc-salvar").addEventListener("click", async () => {

// ---------------------------------------------------------------------------
// FECHAR O PEDIDO — a decisão de compra (20/11/2026)
//
// ⚑ ESTE BOTÃO NÃO EXISTIA. A regra de fechar pedido a partir do mapa estava
// escrita e testada desde 05/09/2026, e a tela nunca ganhou a porta: dava para
// cotar, comparar e mandar e-mail — e não dava para COMPRAR. O roteiro de
// homologação mandava "no mapa, feche o pedido com um fornecedor"; quem
// seguisse o roteiro parava ali. (É o mesmo formato da etapa do DP que tinha
// regra e não tinha botão.)
//
// O diálogo responde, numa tela só, às perguntas do fechamento: de QUEM, O
// QUÊ, em que CONDIÇÃO, para QUANDO e ONDE DESCE. A última é pedido dele do
// mesmo dia: "precisamos prever quando a entrega não for na obra, por exemplo
// na sede. Isso pode ser definido no fechamento. A princípio a entrega é na
// obra."
// ---------------------------------------------------------------------------
let FECH = null;

async function abrirFechamento(colunaId){
  try {
    FECH = await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/fechamento`);
  } catch(e){ aviso("mensagem", e.message, "erro"); return; }
  const comLivre = FECH.fornecedores.filter(f => f.livres > 0);
  if (!comLivre.length) {
    aviso("mensagem", FECH.fornecedores.length
      ? "Não há o que fechar: ou ninguém tem preço lançado, ou todos os itens "
        + "cotados já estão em pedido."
      : "Acrescente um fornecedor e lance os preços antes de fechar.", "alerta");
    return;
  }
  // Abre no fornecedor com mais itens no MENOR preço — é o palpite mais útil.
  const melhor = colunaId || comLivre.slice().sort((a, b) =>
    b.itens.filter(i => i.livre && i.menor).length -
    a.itens.filter(i => i.livre && i.menor).length)[0].cotacao_fornecedor_id;

  els("dlg-titulo").textContent = `Fechar pedido — ${MAPA.numero}`;
  els("dlg-corpo").innerHTML = `<div id="dlg-msg"></div>
    <div class="cartao-dica" style="margin-bottom:10px">Um pedido é de <b>um
      fornecedor</b>. Se a compra vai ser dividida, feche um pedido para cada
      um — os itens que ficarem de fora continuam livres no mapa. O pedido
      nasce <b>aguardando autorização</b>.</div>
    <div class="campo"><label>De quem comprar</label>
      <select id="fp-forn">${FECH.fornecedores.map(f => `<option
        value="${f.cotacao_fornecedor_id}" ${f.livres ? "" : "disabled"}
        ${f.cotacao_fornecedor_id === melhor ? "selected" : ""}>${escapar(f.fornecedor)}
        — ${f.livres} item(ns) livre(s)</option>`).join("")}</select></div>
    <div id="fp-itens"></div>
    <div class="grade" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:10px">
      <div class="campo"><label>Condição de pagamento</label>
        <select id="fp-cond"><option value="">— escolha —</option>${BASE.condicoes
          .filter(c => c.ativo !== false).map(c => `<option value="${c.id}">${escapar(c.nome)}</option>`).join("")}
        </select></div>
      <div class="campo"><label>Material em obra até</label>
        <input type="date" id="fp-previsao"></div>
      <div class="campo"><label>Frete por conta de quem</label>
        <select id="fp-entrega"><option value="">—</option>
          <option value="ENTREGA">Fornecedor entrega (CIF)</option>
          <option value="COLETA">Nós coletamos (FOB)</option></select></div>
      <div class="campo"><label>Frete (R$)</label>
        <input id="fp-frete" inputmode="decimal" data-sem-mascara></div>
      <div class="campo"><label>Desconto (R$)</label>
        <input id="fp-desconto" inputmode="decimal" data-sem-mascara></div>
    </div>
    <label class="opcao" style="margin-top:8px"><input type="checkbox" id="fp-antecipado">
      <span class="rotulo">Pagamento antecipado (paga antes de o material chegar)</span></label>
    <h4 style="margin-top:14px">Onde o material desce</h4>
    <div id="fp-locais"></div>
    <div class="campo" style="margin-top:10px"><label>Observações para o fornecedor</label>
      <textarea id="fp-obs" rows="2" placeholder="ex.: descarga só até as 16h; ligar antes para o encarregado"></textarea></div>
    <div style="margin-top:12px; display:flex; gap:10px; align-items:center">
      <button class="btn" id="fp-salvar">Fechar e mandar para autorização</button>
      <span id="fp-total" class="dados" style="font-weight:700"></span>
    </div>`;
  els("fp-forn").addEventListener("change", desenharFechamento);
  els("fp-salvar").addEventListener("click", confirmarFechamento);
  ["fp-frete", "fp-desconto"].forEach(id => els(id).addEventListener("input", totalDoFechamento));
  desenharFechamento();
  els("dlg").showModal();
}

function fornecedorDoFechamento(){
  return FECH.fornecedores.find(f => f.cotacao_fornecedor_id === +els("fp-forn").value);
}

function desenharFechamento(){
  const f = fornecedorDoFechamento();
  // As condições do cabeçalho vêm do que o fornecedor respondeu no mapa — e
  // continuam editáveis, porque a negociação final muda frete e desconto.
  els("fp-cond").value = f.condicao_pagamento_id || "";
  els("fp-entrega").value = f.entrega || "";
  els("fp-frete").value = Number(f.frete) > 0 ? String(f.frete).replace(".", ",") : "";
  els("fp-desconto").value = Number(f.desconto) > 0 ? String(f.desconto).replace(".", ",") : "";
  els("fp-itens").innerHTML = `<table style="margin-top:8px"><thead><tr><th></th>
      <th>Item</th><th>Obra</th><th class="direita">Qtd</th>
      <th class="direita">Unitário</th><th class="direita">Total</th></tr></thead><tbody>
    ${f.itens.map(i => `<tr ${i.livre ? "" : `style="opacity:.55"`}>
      <td><input type="checkbox" class="fp-item" value="${i.cotacao_item_id}"
        data-total="${i.total}" data-obra="${i.obra_id}"
        ${i.livre ? (i.menor ? "checked" : "") : "disabled"}></td>
      <td>${escapar(i.insumo)}${i.especificacao ? `<br><small>${escapar(i.especificacao)}</small>` : ""}
        ${i.livre ? (i.menor ? `<br><small style="color:var(--verde)">menor preço do mapa</small>` : "")
                  : `<br><small>${escapar(i.motivo || "")}</small>`}</td>
      <td class="dados">${escapar(i.obra || "")}</td>
      <td class="direita dados">${quantidadeBR(i.quantidade)} ${escapar(i.unidade)}</td>
      <td class="direita dados">${numero(i.preco_unitario)}</td>
      <td class="direita dados">${numero(i.total)}</td></tr>`).join("")}
    </tbody></table>
    <div class="cartao-dica" style="margin-top:6px">Vêm marcados os itens em que
      este fornecedor tem o menor preço. Marque os outros se a compra for
      fechada toda com ele.</div>`;
  document.querySelectorAll(".fp-item").forEach(i => i.addEventListener("change", () => {
    locaisDoFechamento(); totalDoFechamento(); }));
  locaisDoFechamento();
  totalDoFechamento();
}

// Um bloco por OBRA presente nos itens marcados. A regra é a obra; a sede e o
// "outro endereço" são a exceção, escolhida aqui.
function locaisDoFechamento(){
  const marcadas = new Set([...document.querySelectorAll(".fp-item:checked")]
    .map(i => +i.dataset.obra));
  const anteriores = {};
  document.querySelectorAll(".fp-local").forEach(b => anteriores[b.dataset.obra] = {
    tipo: b.querySelector(".fp-tipo").value,
    rotulo: b.querySelector(".fp-rotulo").value,
    endereco: b.querySelector(".fp-endereco").value});
  els("fp-locais").innerHTML = FECH.obras.filter(o => marcadas.has(o.id)).map(o => {
    const a = anteriores[o.id] || {tipo: "OBRA", rotulo: "", endereco: ""};
    return `<div class="fp-local" data-obra="${o.id}" style="border:1px solid var(--borda,#DCE0E7);
        border-radius:8px; padding:8px 10px; margin-bottom:6px">
      <b>${escapar(o.rotulo)}</b>
      <select class="fp-tipo" data-sem-busca style="display:block; width:100%; margin-top:4px">
        <option value="OBRA" ${a.tipo === "OBRA" ? "selected" : ""}>Na obra — ${escapar(o.endereco)}</option>
        <option value="SEDE" ${a.tipo === "SEDE" ? "selected" : ""} ${o.sede.tem ? "" : "disabled"}
          >${escapar(o.sede.rotulo)} — ${escapar(o.sede.tem ? o.sede.endereco : "empresa sem endereço no cadastro")}</option>
        <option value="OUTRO" ${a.tipo === "OUTRO" ? "selected" : ""}>Outro endereço…</option>
      </select>
      <div class="fp-outro" style="display:${a.tipo === "OUTRO" ? "block" : "none"}; margin-top:6px">
        <input class="fp-rotulo" placeholder="nome do local (ex.: Depósito central)"
          value="${escapar(a.rotulo)}" style="margin-bottom:4px">
        <input class="fp-endereco" placeholder="endereço completo, com cidade e CEP"
          value="${escapar(a.endereco)}">
      </div>
      ${o.endereco === "Endereço não informado" ? `<div class="aviso alerta" style="margin:6px 0 0">
        Esta obra está sem endereço no cadastro — o pedido sairia dizendo
        "Endereço não informado".</div>` : ""}
    </div>`;
  }).join("") || `<div class="cartao-dica">marque ao menos um item</div>`;
  document.querySelectorAll(".fp-tipo").forEach(sel => sel.addEventListener("change", () => {
    sel.closest(".fp-local").querySelector(".fp-outro").style.display =
      sel.value === "OUTRO" ? "block" : "none"; }));
}

function totalDoFechamento(){
  const br = v => Number(String(v || "0").replace(/\./g, "").replace(",", ".")) || 0;
  const itens = [...document.querySelectorAll(".fp-item:checked")]
    .reduce((s, i) => s + Number(i.dataset.total), 0);
  const total = Math.max(itens + br(els("fp-frete").value) - br(els("fp-desconto").value), 0);
  els("fp-total").textContent = `Total do pedido: ${moeda(total)}`;
}

async function confirmarFechamento(){
  const br = v => String(v || "").trim() ? String(v).replace(/\./g, "").replace(",", ".") : "0";
  const itens = [...document.querySelectorAll(".fp-item:checked")].map(i => +i.value);
  if (!itens.length) { aviso("dlg-msg", "Marque os itens que vão neste pedido.", "erro"); return; }
  if (!els("fp-cond").value) {
    aviso("dlg-msg", "Escolha a condição de pagamento — é ela que diz ao financeiro "
      + "quando esta compra vai ser paga.", "erro"); return; }
  if (!els("fp-previsao").value) {
    aviso("dlg-msg", "Informe até quando o material tem de estar na obra — sem a data, "
      + "o sistema não tem como avisar do atraso nem projetar o pagamento.", "erro"); return; }
  const locais = [...document.querySelectorAll(".fp-local")].map(b => ({
    obra_id: +b.dataset.obra, tipo: b.querySelector(".fp-tipo").value,
    rotulo: b.querySelector(".fp-rotulo").value,
    endereco: b.querySelector(".fp-endereco").value}));
  els("fp-salvar").disabled = true;
  try {
    const r = await api(`/erp/api/suprimentos/cotacoes/${MAPA.id}/fechar`, {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({cotacao_fornecedor_id: +els("fp-forn").value, itens,
        condicao_pagamento_id: +els("fp-cond").value,
        previsao_entrega: els("fp-previsao").value,
        entrega: els("fp-entrega").value || null,
        frete: br(els("fp-frete").value), desconto: br(els("fp-desconto").value),
        antecipado: els("fp-antecipado").checked,
        observacoes: els("fp-obs").value, locais_entrega: locais})});
    els("dlg").close();
    aviso("mensagem", `Pedido ${r.numero} fechado e aguardando autorização. `
      + `<a href="/erp/suprimentos/pedidos?pedido=${r.id}">abrir o pedido</a>`, "ok");
    abrirMapa(MAPA.id);
  } catch(e){ aviso("dlg-msg", e.message, "erro"); els("fp-salvar").disabled = false; }
}

els("btn-nova-cot").addEventListener("click", () => novaCotacao().catch(
  e => aviso("mensagem", e.message, "erro")));
els("f-busca").addEventListener("input", desenharLista);
els("btn-limpar").addEventListener("click", () => {
  STATUS.clear(); els("f-busca").value = ""; desenharLista();
});

carregarListas().then(() => {
  // A cotação nasce na tela de Solicitações e manda para cá pelo endereço:
  // quem acabou de gerar o mapa quer VER o mapa, não procurá-lo numa lista.
  const pedida = new URLSearchParams(location.search).get("cotacao");
  if (pedida) abrirMapa(+pedida);
}).catch(e => aviso("mensagem", e.message, "erro"));
</script>
