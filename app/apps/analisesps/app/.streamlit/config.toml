# Config do Streamlit — vale local e no Render.
# IMPORTANTE: nada de 'headless' nem '[browser] serverPort' aqui — esses são por
# ambiente (o .bat define local; o render.yaml define no Render via --server.port $PORT).
# Pôr serverPort fixo aqui QUEBRA o acesso no Render (proxy).

[theme]
base = "light"
primaryColor = "#1f7a3d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3ee"
textColor = "#1b1b1b"
font = "sans serif"

[server]
port = 8520                 # porta local; no Render o --server.port $PORT sobrepõe
maxUploadSize = 50          # MB por upload (PDFs de comprovante etc.)
enableXsrfProtection = true
# runOnSave = true          # opcional: recarrega ao salvar (útil só no seu PC de dev)

[browser]
gatherUsageStats = false

[client]
# Esconde as ferramentas de desenvolvedor (menu "Clear caches"/"Rerun" e atalhos
# de teclado C/R) para o usuário final — evita limpar o cache sem querer ao copiar.
toolbarMode = "minimal"