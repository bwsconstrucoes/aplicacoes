{# A janela do funcionário das outras folhas. Quem inclui chama
   `abrirFichaDoFuncionario(cpf, ano, mes)`. #}
<dialog class="dialogo" id="cartao-ficha">
  <button class="btn secundario dialogo-fechar" type="button"
          onclick="this.closest('dialog').close()">Fechar</button>
  <div id="cartao-ficha-corpo"><p class="cartao-dica">Carregando…</p></div>
</dialog>
<script>
(function () {
  const dialogo = document.getElementById("cartao-ficha");
  const corpo = document.getElementById("cartao-ficha-corpo");
  let aberto = null;

  async function carregar(cpf, ano, mes) {
    aberto = {cpf, ano, mes};
    corpo.innerHTML = '<p class="cartao-dica">Carregando…</p>';
    if (!dialogo.open) dialogo.showModal();
    try {
      const r = await fetch("/analisesps/folha/pessoa/" + cpf + "/ficha" +
                            (ano ? "?ano=" + ano + "&mes=" + mes : ""));
      corpo.innerHTML = await r.text();
    } catch (e) {
      corpo.innerHTML = '<div class="aviso erro">Não foi possível carregar a ficha: ' + e + "</div>";
    }
  }
  window.abrirFichaDoFuncionario = carregar;

  // --- LANÇAR BATIDAS (o mesmo pedido do analítico da folha, pelo mês) -------
  function pedidoLancar(q) {
    return {cpf: q.dataset.cpf, nome: q.dataset.nome, ano: q.dataset.ano, mes: q.dataset.mes,
            de: q.querySelector(".lancar-de").value, ate: q.querySelector(".lancar-ate").value,
            obra: q.querySelector(".lancar-obra").value,
            hora_avulsa: q.querySelector(".lancar-avulsa").value,
            justificativa: q.querySelector(".lancar-justificativa").value};
  }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g,
      c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  }
  corpo.addEventListener("input", e => {
    const q = corpo.querySelector("#ficha-lancar");
    if (q && q.contains(e.target)) q.querySelector(".lancar-enviar").hidden = true;
  });
  async function verLancamento() {
    const q = corpo.querySelector("#ficha-lancar");
    const recadoQ = q.querySelector(".lancar-recado");
    const area = q.querySelector(".lancar-plano");
    const enviar = q.querySelector(".lancar-enviar");
    recadoQ.textContent = "Gerando pré-visualização…";
    enviar.hidden = true;
    try {
      const r = await fetch("{{ url_for('analisesps.folha_ponto_plano') }}", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(pedidoLancar(q))});
      const d = await r.json();
      if (!d.ok) { recadoQ.textContent = d.erro; area.innerHTML = ""; return; }
      const p = d.plano;
      recadoQ.textContent = p.batidas
        ? p.batidas + " batida(s) em " + p.dias_com_lancamento + " dia(s)" +
          (p.pulados.length ? "; " + p.pulados.length + " dia(s) sem alteração" : "")
        : "Nenhuma batida a lançar neste período. Confira o motivo de cada dia.";
      area.innerHTML = '<table class="sps mini"><thead><tr><th>Dia</th><th>Existentes</th>' +
        "<th>A lançar</th><th>Desconsiderado</th></tr></thead><tbody>" +
        p.dias.map(x => "<tr><td>" + esc(x.data_br) + ' <span class="cartao-dica">' +
          esc(x.semana) + "</span></td><td>" + (x.ja.length ? esc(x.ja.join(", ")) : "—") +
          "</td><td><b>" + (x.lancar.length ? esc(x.lancar.join(", ")) : "") +
          '</b></td><td><span class="cartao-dica">' + esc(x.motivo || "") +
          "</span></td></tr>").join("") + "</tbody></table>";
      if (p.batidas) {
        enviar.textContent = "Lançar " + p.batidas + " batida(s) no Mobponto";
        enviar.hidden = false;
      }
    } catch (erro) {
      recadoQ.textContent = "Não foi possível gerar a pré-visualização: " + erro + ".";
    }
  }
  async function enviarLancamento(b) {
    const q = corpo.querySelector("#ficha-lancar");
    const recadoQ = q.querySelector(".lancar-recado");
    const pedido = pedidoLancar(q);
    if ((pedido.justificativa || "").trim().length < 5) {
      recadoQ.textContent = "Informe a justificativa (mínimo de 5 caracteres).";
      q.querySelector(".lancar-justificativa").focus();
      return;
    }
    if (!confirm(b.textContent + " para " + q.dataset.nome + ", na obra " +
                 pedido.obra.toUpperCase() + "?\n\nAs batidas já registradas não serão " +
                 "alteradas. Lançamentos enviados ao Mobponto não podem ser desfeitos " +
                 "por esta tela.")) return;
    b.disabled = true;
    recadoQ.textContent = "Iniciando…";
    try {
      const r = await fetch("{{ url_for('analisesps.folha_ponto_lancar') }}", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(pedido)});
      const d = await r.json();
      if (!d.ok) { recadoQ.textContent = d.erro; b.disabled = false; return; }
      b.hidden = true; b.disabled = false;
      recadoQ.textContent = d.fila_id
        ? "Solicitação incluída na fila. A janela pode ser fechada; o resultado aparece na fila do ponto."
        : "Lançamento iniciado. O resultado aparece na fila do ponto.";
    } catch (erro) {
      recadoQ.textContent = "Não foi possível lançar: " + erro + ". Confira no Mobponto antes de reenviar.";
      b.disabled = false;
    }
  }

  function recado(texto, ruim) {
    const alvo = corpo.querySelector(".ficha-recado");
    if (alvo) { alvo.textContent = texto; alvo.classList.toggle("ruim", !!ruim); }
  }

  corpo.addEventListener("click", async e => {
    const botao = e.target.closest("button");
    if (!botao) return;
    if (botao.classList.contains("ficha-cadastro-completo")) {
      const caixa = corpo.querySelector(".ficha-cadastro-completo-caixa");
      caixa.hidden = false;
      caixa.innerHTML = '<p class="cartao-dica">Consultando a planilha de cadastro…</p>';
      try {
        const r = await fetch("/analisesps/folha/pessoa/" + botao.dataset.cpf + "/cadastro");
        caixa.innerHTML = await r.text();
      } catch (err) { caixa.innerHTML = '<div class="aviso erro">Não foi possível consultar o cadastro: ' + err + "</div>"; }
      return;
    }
    if (botao.classList.contains("ficha-atualizar-cadastro")) {
      botao.disabled = true;
      recado("Atualizando o cadastro…");
      try {
        const r = await fetch("{{ url_for('analisesps.folha_cadastro_pessoa_atualizar') }}", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({cpf: botao.dataset.cpf})});
        const d = await r.json();
        if (!d.ok) { recado(d.erro, true); botao.disabled = false; return; }
        await carregar(aberto.cpf, aberto.ano, aberto.mes);
        recado(d.mensagem + " Recarregue a lista para exibir a alteração.");
      } catch (err) { recado("Não foi possível atualizar o cadastro: " + err, true); botao.disabled = false; }
      return;
    }
    if (botao.classList.contains("ficha-lancar-dia")) {
      const q = corpo.querySelector("#ficha-lancar");
      if (!q) return;
      q.querySelector(".lancar-de").value = botao.dataset.data;
      q.querySelector(".lancar-ate").value = botao.dataset.data;
      q.scrollIntoView({behavior: "smooth", block: "start"});
      if (q.querySelector(".lancar-obra").value) q.querySelector(".lancar-ver").click();
      return;
    }
    if (botao.classList.contains("lancar-ver")) { await verLancamento(); return; }
    if (botao.classList.contains("lancar-enviar")) { await enviarLancamento(botao); return; }
    if (botao.classList.contains("ficha-atualizar-ponto")) {
      botao.disabled = true;
      recado("Solicitando o ponto ao Mobponto…");
      try {
        const r = await fetch("{{ url_for('analisesps.folha_ponto_pessoa_atualizar') }}", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({cpf: botao.dataset.cpf, nome: botao.dataset.nome,
                                ano: botao.dataset.ano, mes: botao.dataset.mes})});
        const d = await r.json();
        if (!d.ok) { recado(d.erro, true); botao.disabled = false; return; }
        recado(d.posicao ? "Solicitação na fila: " + d.posicao + " pedido(s) à frente. A janela pode ser fechada."
                         : "Solicitação registrada. O ponto será atualizado em alguns minutos. A janela pode ser fechada.");
      } catch (err) { recado("Não foi possível atualizar o ponto: " + err, true); botao.disabled = false; }
    }
  });
})();
</script>
